<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seal Document - Secured</title>
<style>body{font-family:Arial;background:#051208;padding:12px;color:#fff}.box{background:#fff;color:#222;max-width:540px;margin:20px auto;padding:22px;border-radius:18px}input,select{width:100%;padding:12px;border:2px solid #0a4d2a;border-radius:10px;margin-bottom:10px;box-sizing:border-box}button{width:100%;padding:14px;background:#0a4d2a;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-top:6px}label{font-size:11px;font-weight:800;color:#0a4d2a}#hash{font-size:10px;background:#e8f5e9;padding:8px;border-radius:6px;word-break:break-all;margin:6px 0}</style>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp,getDocs} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {getAuth,signInWithPopup,GoogleAuthProvider} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",authDomain:"arnaudafrochaineverification.firebaseapp.com",projectId:"arnaudafrochaineverification",storageBucket:"arnaudafrochaineverification.firebasestorage.app",messagingSenderId:"268502946630",appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);const provider=new GoogleAuthProvider();
let currentUser=null;

window.doLogin=async()=>{
 try{const res=await signInWithPopup(auth,provider);currentUser=res.user;document.getElementById('loginStatus').innerText="✅ Logged as: "+currentUser.email;document.getElementById('loginBtn').style.display="none";loadDirectors();}catch(e){alert("Login fail: "+e.message)}
};

async function loadDirectors(){
 try{const snap=await getDocs(collection(db,"directors"));const sel=document.getElementById('directorSel');sel.innerHTML="";snap.forEach(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=d.data().directorName+" - "+d.data().companyName;sel.appendChild(o);});}catch(e){console.log(e)}
}

window.sealDoc=async()=>{
 if(!currentUser){alert("Abeg login first!");return;}
 const title=document.getElementById('docTitle').value;const dirId=document.getElementById('directorSel').value;
 if(!title||!dirId){alert("Title & Director needed");return;}
 const hash="SHA256-"+Date.now().toString(16)+"-"+Math.random().toString(16).slice(2);
 document.getElementById('hash').innerText="Hash: "+hash;
 const btn=document.getElementById('sealBtn');btn.innerText="⏳ SEALING...";
 try{
   const ref=await addDoc(collection(db,"sealedDocs"),{documentTitle:title,directorId:dirId,documentHash:hash,sealedAt:serverTimestamp(),ownerWallet:"0x64478336d9018927C8E45AcC35e9e24c969EfAE2",status:"SEALED"});
   alert("✅ DOCUMENT SEALED! ID: "+ref.id+"\nHash: "+hash);btn.innerText="✅ SEALED";
 }catch(e){alert("Seal fail: "+e.message);btn.innerText="❌ FAILED";console.error(e)}
};
</script></head><body><div class="box">
<h3 style="text-align:center;color:#0a4d2a;margin:0 0 10px 0">📜 SEAL DOCUMENT - SECURED</h3>
<button id="loginBtn" onclick="doLogin()" style="background:#4285f4">🔐 LOGIN WITH arnaudafrochain@gmail.com</button>
<div id="loginStatus" style="font-size:10px;color:green;margin:6px 0">Not logged in - Login to seal</div>
<label>Document Title *</label><input id="docTitle" placeholder="Board Resolution 2026">
<label>Select Director *</label><select id="directorSel"><option>Login first to load directors</option></select>
<div id="hash">Hash go show here after seal</div>
<button id="sealBtn" onclick="sealDoc()">🔏 SEAL DOCUMENT ON BLOCKCHAIN</button>
<p style="font-size:9px;color:#666;margin-top:10px">✅ Secured by your new rule: Only you fit seal. Bank fit verify.</p>
</div></body></html>
