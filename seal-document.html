<!DOCTYPE html>
<html>
<head>
<title>SEAL DOCUMENT - ARNAUD TRUST VERIFY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; padding:15px; background:#f5f5f5}
.box{background:white; padding:20px; border-radius:12px; max-width:650px; margin:auto; box-shadow:0 2px 15px #ccc}
input, select{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #aaa; font-size:15px}
button{width:100%; padding:14px; background:#0a5c36; color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer}
.green{border:3px solid #0a5c36; background:#f0f9f0; padding:15px; border-radius:8px; margin-top:15px}
#qr{width:280px; height:280px; border:8px solid #0a5c36; border-radius:12px; margin:10px auto; display:block}
</style>
</head>
<body>
<div class="box">
<h2>🔒 SEAL DOCUMENT</h2>
<p style="font-size:13px; color:#555;">ARNAUD AFROCHAINE VERIFICATION LTD - Anti-Fraud</p>

<input type="text" id="docName" placeholder="Document Name e.g Board Resolution 2024" />
<input type="text" id="docType" placeholder="Document Type e.g Board Resolution" />
<input type="text" id="director" placeholder="Director Name" />
<input type="text" id="sealedBy" placeholder="Sealed By (Your Name)" value="Arnaud Trust Verify Admin" />
<input type="file" id="fileInput" />

<button onclick="sealDoc()">🔐 SEAL & GENERATE HASH</button>

<div id="result"></div>
<div id="qrBox" style="display:none; text-align:center; margin-top:20px;">
<h3 style="color:#0a5c36;">✅ SEALED SUCCESSFULLY</h3>
<img id="qrImg" />
<p id="hashText" style="font-size:11px; word-break:break-all; background:#fff; padding:10px; border:1px dashed #0a5c36;"></p>
<p id="linkText" style="font-size:11px; word-break:break-all; color:#0a5c36;"></p>
<button onclick="window.print()" style="background:#222; margin-top:10px;">🖨️ PRINT CERTIFICATE WITH QR</button>
<a id="verifyLink" target="_blank"><button style="background:#007bff; margin-top:10px;">🔍 TEST VERIFY NOW</button></a>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function sha256(file){
  const buffer = await file.arrayBuffer();
  const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

window.sealDoc = async function(){
  const file = document.getElementById('fileInput').files[0];
  const docName = document.getElementById('docName').value.trim();
  const docType = document.getElementById('docType').value.trim();
  const director = document.getElementById('director').value.trim();
  const sealedBy = document.getElementById('sealedBy').value.trim();

  if(!file || !docName){ alert('Select file and enter document name'); return; }
  
  document.getElementById('result').innerHTML = 'Calculating hash & sealing...';

  try{
    const hash = await sha256(file);
    await setDoc(doc(db, "sealedDocs", hash), {
      docName: docName,
      docType: docType,
      director: director,
      sealedBy: sealedBy,
      hash: hash,
      fileName: file.name,
      fileSize: file.size,
      timestamp: serverTimestamp(),
      date: new Date().toISOString()
    });

    const verifyUrl = `https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify-signature.html?hash=${hash}`;
    const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(verifyUrl)}`;

    document.getElementById('result').innerHTML = '';
    document.getElementById('qrImg').src = qrApi;
    document.getElementById('hashText').innerText = hash;
    document.getElementById('linkText').innerText = verifyUrl;
    document.getElementById('verifyLink').href = verifyUrl;
    document.getElementById('qrBox').style.display='block';
    
  }catch(e){
    document.getElementById('result').innerHTML = `<p style="color:red;">Error: ${e.message}<br>Check Firestore Rules: allow read, write: if true;</p>`;
    console.error(e);
  }
}
</script>
</body>
  </html>
