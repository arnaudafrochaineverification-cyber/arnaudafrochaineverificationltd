import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "1040282440264",
  appId: "1:1040282440264:web:xxxx"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.sealDocument = async function() {
  const docName = document.getElementById('docName').value;
  const docType = document.getElementById('docType').value;
  const director = document.getElementById('director').value;
  const sealedBy = document.getElementById('sealedBy').value;
  const fileInput = document.getElementById('fileInput');
  
  if(!docName || !docType || !director || !sealedBy || fileInput.files.length==0){
    alert("Fill all fields and choose file!");
    return;
  }

  const file = fileInput.files[0];
  const buffer = await file.arrayBuffer();
  const hashArray = await crypto.subtle.digest('SHA-256', buffer);
  const hashHex = Array.from(new Uint8Array(hashArray)).map(b=>b.toString(16).padStart(2,'0')).join('');
  
  const now = new Date();
  const dateStr = now.toLocaleString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'});

  // SAVE TO FIRESTORE
  try{
    await setDoc(doc(db, "sealed_documents", hashHex), {
      documentName: docName,
      documentType: docType,
      director: director,
      sealedBy: sealedBy,
      date: dateStr,
      hash: hashHex,
      timestamp: now
    });
  }catch(e){
    alert("Error: "+e.message);
    return;
  }

  // SHOW RESULT
  document.getElementById('result').style.display='block';
  document.getElementById('hashText').innerText = hashHex;
  const verifyUrl = `https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify-signature.html?hash=${hashHex}`;
  document.getElementById('verifyLink').innerText = verifyUrl;
  document.getElementById('verifyLink').href = verifyUrl;
  
  document.getElementById('qrcode').innerHTML="";
  new QRCode(document.getElementById('qrcode'), {text: verifyUrl, width:256, height:256});

  // SAVE FOR PRINT
  window.lastSealData = {docName, docType, director, sealedBy, dateStr, hashHex, verifyUrl};
  
  document.getElementById('status').innerHTML="✅ SEALED SUCCESSFULLY";
  document.getElementById('status').style.color="green";
}

window.printCertificate = function(){
  if(!window.lastSealData){ alert("Seal a document first!"); return; }
  const d = window.lastSealData;
  const qrDiv = document.getElementById('qrcode').innerHTML;
  
  const certWindow = window.open('', '_blank');
  certWindow.document.write(`

.boxes{display:flex; gap:15px; justify-content:space-between;}

.seal{width:110px; height:110px; background:radial-gradient(#ffd700, #b8860b); border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center; font-size:10px; font-weight:bold; color:#0a4a2a; border:3px double #0a4a2a; line-height:1.2;}
.qr{text-align:center;}
.qr canvas, .qr img{width:130px !important; height:130px !important;}

@media print{body{margin:0} .cert{margin:0; border-width:8px} button{display:none}}
</style></head><body>
<div class="cert"><div class="inner">

<div class="sub">INCORPORATED • DOCUMENT VERIFICATION & COMPLIANCE • REGISTERED</div>

</div>

</div>
</div>

<div class="qr"><div id="printQR"></div><div style="font-size:9px; margin-top:5px;">QR CODE • SCAN TO VERIFY</div><div style="font-size:8px; word-break:break-all; width:140px;">${d.verifyUrl}</div></div>
</div>
</div>
<div class="bottom">CERTIFICATE NO.: AAVL-COA-${new Date().getFullYear()}-${d.hashHex.substring(0,6).toUpperCase()} • ISSUED UNDER OFFICIAL VERIFICATION AUTHORITY</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script>

new QRCode(document.getElementById('printQR'), {text: "${d.verifyUrl}", width:130, height:130});
setTimeout(()=>{window.print();}, 800);

  `);
}

window.testVerify = function(){
  if(!window.lastSealData) return;
  window.open(window.lastSealData.verifyUrl, '_blank');
}
</script>
<style>
