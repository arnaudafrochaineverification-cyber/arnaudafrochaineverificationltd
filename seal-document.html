<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seal - ARNAUD AFROCHAINE TRUST SYSTEMS LTD RC 179223482696</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
body{background:#f1f5f9;padding:12px;font-family:Inter,sans-serif;margin:0}
.box{max-width:720px;margin:auto;background:white;padding:22px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
label{font-weight:800;font-size:12px;margin-top:14px;display:block}
input,select{width:100%;padding:12px;margin-top:6px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px}
button.main{width:100%;padding:16px;background:#0a1f0f;color:#4ade80;border:none;border-radius:12px;font-weight:900;margin-top:18px;cursor:pointer}
.preview{margin-top:8px;text-align:center;display:none;background:#f0fdf4;border:1px dashed #22c55e;padding:10px;border-radius:10px}
.hash{word-break:break-all;background:#052e16;color:#4ade80;padding:12px;border-radius:10px;font-size:11px;margin-top:12px}
</style>
</head>
<body>
<div class="box">
<h3>🔒 ARNAUD AFROCHAINE TRUST SYSTEMS LTD</h3>
<small>RC 179223482696 • AV 179223482696 • D All-in-One Trust • Firebase Connected ✅</small>

<label>Category</label>
<select id="cat"><option>Board Resolution</option><option>Contract / Agreement</option><option>MoU</option><option>Certificate</option><option>Corporate Document</option></select>

<label>Title *</label><input id="title" placeholder="Board Resolution for Loan">
<label>Director Name *</label><input id="director" placeholder="Ikeshuku / Arnaud">
<label>Issuing Organization *</label><input id="issuer" placeholder="Ikeshuku Enterprises Ltd">

<label>PDF File</label><input type="file" id="docFile">

<label>👆 Fingerprint (Your Spikey) - UPLOAD HERE</label>
<input type="file" id="fp" accept="image/*">
<div id="fpPrev" class="preview"></div>

<label>✍️ Signature</label><input type="file" id="sig" accept="image/*">
<div id="sigPrev" class="preview"></div>

<button class="main" onclick="sealDoc()">🔒 SEAL & GENERATE HASH + QR + SAVE TO FIREBASE</button>
<p id="status" style="text-align:center;margin-top:10px;font-weight:700"></p>

<div id="res" style="display:none;margin-top:20px;border-top:2px dashed #ddd;padding-top:16px">
<div id="qr" style="display:flex;justify-content:center;background:#f8fafc;padding:14px;border-radius:12px"></div>
<div id="hashBox" class="hash"></div>
<button class="main" style="background:white;color:#0a1f0f;border:2px solid #0a1f0f" onclick="goVerify()">TEST VERIFY NOW →</button>
</div>
</div>

<script>
// YOUR REAL FIREBASE CONFIG - EMBEDDED - NO MORE WHITE SCREEN
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let fpData='',sigData='',myHash='';

document.getElementById('fp').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{ fpData=ev.target.result; let p=document.getElementById('fpPrev'); p.style.display='block'; p.innerHTML='<img src="'+fpData+'" style="width:90px;height:90px;object-fit:cover;border-radius:10px;border:2px solid green"><br><small>✅ Spikey / Fingerprint Ready</small>'; };
 r.readAsDataURL(f);
});
document.getElementById('sig').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{ sigData=ev.target.result; let p=document.getElementById('sigPrev'); p.style.display='block'; p.innerHTML='<img src="'+sigData+'" style="width:150px;height:60px;object-fit:contain;border:2px solid green;border-radius:6px"><br><small>✅ Signature Ready</small>'; };
 r.readAsDataURL(f);
});

async function sealDoc(){
 let title=document.getElementById('title').value.trim();
 let director=document.getElementById('director').value.trim();
 let issuer=document.getElementById('issuer').value.trim();
 let cat=document.getElementById('cat').value;
 if(!title||!director){alert('Fill Title and Director');return;}
 document.getElementById('status').innerText='⏳ Sealing...';
 myHash=CryptoJS.SHA256(title+director+issuer+Date.now()).toString();
 const payload={title,director,issuer,category:cat,hash:myHash,fpData,sigData,rc:"179223482696",company:"ARNAUD AFROCHAINE TRUST SYSTEMS LTD",date:new Date().toISOString(),dateLocal:new Date().toLocaleString(),blockchain:"500B ARNAUD"};
 try{
   await db.collection('documents').doc(myHash).set(payload);
   document.getElementById('status').innerText='✅ Saved to Firebase Global Network! ARNAUD TRUST SYSTEMS LTD';
 }catch(err){
   document.getElementById('status').innerText='❌ Firebase Error: '+err.message;
   console.error(err);
   return;
 }
 localStorage.setItem('lastHash',myHash);
 localStorage.setItem('lastData',JSON.stringify(payload));
 document.getElementById('res').style.display='block';
 document.getElementById('hashBox').innerText='SHA-256: '+myHash;
 document.getElementById('qr').innerHTML='';
 new QRCode(document.getElementById('qr'),{text:'https://arnaudafrochaineverification-cyber.github.io/verify.html?hash='+myHash,width:220,height:220});
}
function goVerify(){ window.open('verify.html?hash='+myHash,'_blank'); }
</script>
</body>
</html>
