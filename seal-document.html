<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seal Board Resolution - ARNAUD AFROCHAINE TRUST</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:system-ui;background:#f0fdf4;margin:0;padding:12px}
.card{background:white;border-radius:16px;padding:16px;max-width:500px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.header{background:#0a4d2a;color:#7CFF9C;padding:10px;border-radius:20px;text-align:center;font-weight:800;font-size:12px;margin-bottom:12px}
h2{margin:6px 0;text-align:center}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:12px}
label{font-weight:700;font-size:14px;margin:12px 0 4px;display:block}
.input-box{border:2px solid #ddd;border-radius:10px;padding:10px;width:100%;box-sizing:border-box;background:#fafafa}
.preview{border:2px dashed #0a4d2a;border-radius:10px;padding:8px;min-height:30px;text-align:center;margin-top:6px;background:#f8fffa;font-size:13px;color:#666}
.btn{background:#0a4d2a;color:#7CFF9C;border:none;width:100%;padding:14px;border-radius:12px;font-weight:800;font-size:16px;margin-top:16px}
.ok{color:green;font-weight:700}
</style>
</head>
<body>
<div class="card">
<div class="header">ARNAUD AFROCHAINE TRUST SYSTEMS LTD • RC 179223482696</div>
<h2>🔒 Seal Board Resolution</h2>
<div class="sub">Upload Document + Spikey + Signature → SHA-256 + QR → Firebase Global</div>

<label>📄 Document</label>
<input type="file" id="pdfFile" class="input-box">
<div id="pdfPreview" class="preview">Choose Document / Document Image</div>

<label>👉 Spikey Fingerprint</label>
<input type="file" id="spikeyFile" class="input-box" accept="image/*">
<div id="spikeyPreview" class="preview">Choose Spikey Fingerprint Image</div>

<label>✍️ Signature</label>
<input type="file" id="sigFile" class="input-box" accept="image/*">
<div id="sigPreview" class="preview">Choose Signature Image</div>

<label>📌 Title</label>
<input id="title" class="input-box" placeholder="e.g. Board Resolution 2026" value="Board resolution">
<label>👤 Director</label>
<input id="director" class="input-box" value="Arnaud Afrochaine">
<label>🏢 Issuer</label>
<input id="issuer" class="input-box" value="ARNAUD AFROCHAINE TRUST SYSTEMS LTD">
<label>📅 Date</label>
<input id="date" type="date" class="input-box">
<div id="status" style="margin-top:10px;padding:10px;border-radius:10px;display:none;background:#eee"></div>
<div id="qrcode" style="text-align:center;margin-top:10px"></div>
<button class="btn" onclick="sealDocument()">🔒 SEAL & SAVE TO FIREBASE</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};
try{ firebase.initializeApp(firebaseConfig); }catch(e){}

let spikeyBase64="", sigBase64="", pdfFileObj=null;
function compress(file, cb){
 const r=new FileReader();
 r.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const c=document.createElement('canvas'), max=300;
   let w=img.width,h=img.height;
   if(w>max||h>max){ if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;} }
   c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
   cb(c.toDataURL('image/jpeg',0.6));
  }; 
  img.onerror=()=>cb(e.target.result);
  img.src=e.target.result;
 }; r.readAsDataURL(file);
}
document.getElementById('pdfFile').addEventListener('change', e=>{
 pdfFileObj=e.target.files[0];
 if(pdfFileObj){
  if(pdfFileObj.type.startsWith('image/')){
   compress(pdfFileObj, d=>{
    document.getElementById('pdfPreview').innerHTML=`<img src="${d}" style="max-width:120px;border-radius:8px"><br>✅ ${pdfFileObj.name}`;
   });
  } else {
   document.getElementById('pdfPreview').innerHTML=`✅ ${pdfFileObj.name} (${(pdfFileObj.size/1024).toFixed(1)}KB)`;
  }
 }
});
document.getElementById('spikeyFile').addEventListener('change', e=>{ compress(e.target.files[0], d=>{ spikeyBase64=d; document.getElementById('spikeyPreview').innerHTML=`<img src="${d}" style="max-width:120px;border-radius:8px"><div class=ok>✅ Spikey Ready</div>`; }); });
document.getElementById('sigFile').addEventListener('change', e=>{ compress(e.target.files[0], d=>{ sigBase64=d; document.getElementById('sigPreview').innerHTML=`<img src="${d}" style="max-width:120px;border-radius:8px"><div class=ok>✅ Signature Ready</div>`; }); });
async function sha256(file){ const b=await file.arrayBuffer(); const h=await crypto.subtle.digest('SHA-256',b); return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function sealDocument(){
 const s=document.getElementById('status'); s.style.display='block';
 if(!pdfFileObj){ s.innerHTML='❌ Choose Document first'; return; }
 if(!spikeyBase64||!sigBase64){ s.innerHTML='❌ Choose Spikey + Signature'; return; }
 try{
  s.innerHTML='⏳ Hashing...'; const hash=await sha256(pdfFileObj);
  s.innerHTML='⏳ Uploading Document...';
  const ref=firebase.storage().ref().child(`documents/${Date.now()}_${pdfFileObj.name}`);
  const snap=await ref.put(pdfFileObj); const url=await snap.ref.getDownloadURL();
  s.innerHTML='⏳ Saving to Firebase...';
  await firebase.firestore().collection('documents').doc(hash).set({
   title:document.getElementById('title').value||'Board Resolution',
   director:document.getElementById('director').value, issuer:document.getElementById('issuer').value,
   date:document.getElementById('date').value||new Date().toISOString().split('T')[0],
   company:'ARNAUD AFROCHAINE TRUST SYSTEMS LTD', rc:'179223482696',
   fileName:pdfFileObj.name, fileUrl:url, storagePath:ref.fullPath,
   spikeyImage:spikeyBase64, signatureImage:sigBase64, hash:hash,
   timestamp:firebase.firestore.FieldValue.serverTimestamp()
  });
  s.innerHTML=`✅ SEALED!<br>Hash: ${hash}<br><a href="${url}" target="_blank">View Document</a>`;
  s.style.background='#d4edda';
  document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'),{text:hash,width:128,height:128});
  alert('✅ SEALED SUCCESSFULLY!');
 }catch(err){ s.innerHTML='❌ '+err.message; console.error(err); }
}
document.getElementById('date').valueAsDate=new Date();
</script>
</body>
</html>
