<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seal Document - Secured</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial;background:#f5f5f5;padding:15px} .card{max-width:600px;margin:20px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.green{background:#0d4a2e;color:white} .red{background:#c62828;color:white} .blue{background:#1565c0;color:white}
.msg{margin-top:10px;padding:12px;border-radius:8px;display:none;word-break:break-all} .ok{background:#e8f5e9} .err{background:#ffebee;color:#c62828}
.logged{background:#e8f5e9;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;font-size:14px}
.hash{font-family:monospace;font-size:11px;background:#f5f5f5;padding:8px;border-radius:6px;margin:8px 0}
</style></head><body><div class="card">
<h2 style="color:#0d4a2e;text-align:center">📜 SEAL DOCUMENT - SECURED</h2>
<div id="loginBox" style="text-align:center"><button class="blue" onclick="login()">🔐 LOGIN WITH GOOGLE</button></div>
<div id="userBox" style="display:none"><div id="loggedInfo" class="logged"></div>
<button class="red" onclick="logout()">🚪 LOGOUT (Will ask password next time)</button>
<label>Director:</label><select id="directorSelect"><option>Loading directors...</option></select>
<label>Document Name:</label><input id="docName" placeholder="e.g. Board Resolution 2026">
<label>Document Type:</label><select id="docType"><option>Board Resolution</option><option>CAC Form</option><option>Share Certificate</option><option>Bank Mandate</option><option>Other</option></select>
<button class="green" onclick="sealDoc()">🔒 SEAL DOCUMENT</button>
<div id="msg" class="msg"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",authDomain:"arnaudafrochaineverification.firebaseapp.com",projectId:"arnaudafrochaineverification",storageBucket:"arnaudafrochaineverification.firebasestorage.app",messagingSenderId:"268502946630",appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47",measurementId:"G-Y52LEBJM7Q"};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore();
function login(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}
function logout(){auth.signOut().then(()=>location.reload());}
auth.onAuthStateChanged(user=>{if(user){document.getElementById('loginBox').style.display='none';document.getElementById('userBox').style.display='block';document.getElementById('loggedInfo').innerHTML='✅ Logged as:<br><b>'+user.email+'</b>';loadDirectors();}else{document.getElementById('loginBox').style.display='block';document.getElementById('userBox').style.display='none';}});
function loadDirectors(){db.collection('directors').get().then(snap=>{const sel=document.getElementById('directorSelect');sel.innerHTML='';if(snap.empty){sel.innerHTML='<option>No directors - Go add for add-director.html</option>';return;}snap.forEach(doc=>{const d=doc.data();const opt=document.createElement('option');opt.value=doc.id;opt.textContent=d.name+' - '+d.title;sel.appendChild(opt);});}).catch(e=>{document.getElementById('directorSelect').innerHTML='<option>Error: '+e.message+'</option>';});}
async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function showMsg(t,ok){const m=document.getElementById('msg');m.style.display='block';m.className='msg '+(ok?'ok':'err');m.innerHTML=t;}
async function sealDoc(){const dirId=document.getElementById('directorSelect').value,dirText=document.getElementById('directorSelect').options[document.getElementById('directorSelect').selectedIndex]?.textContent||'',docName=document.getElementById('docName').value.trim(),docType=document.getElementById('docType').value;if(!docName){showMsg('Enter Document Name Oga!',false);return;}if(!dirId||dirId.includes('No directors')){showMsg('No director found - Add director first!',false);return;}
const raw=dirId+'|'+docName+'|'+docType+'|'+Date.now();const hash=await sha256(raw);showMsg('⏳ Sealing...',true);
db.collection('sealedDocuments').doc(hash).set({directorId:dirId,directorInfo:dirText,documentName:docName,documentType:docType,hash:hash,sealedAt:firebase.firestore.FieldValue.serverTimestamp(),sealedBy:auth.currentUser.email}).then(()=>{const verifyLink='https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify-signature.html?hash='+hash;showMsg(`✅ <b>DOCUMENT SEALED!</b><br><br><b>Doc:</b> ${docName}<br><b>Director:</b> ${dirText}<br><div class="hash"><b>HASH:</b><br>${hash}</div><div class="hash"><b>VERIFY LINK (Give Bank):</b><br>${verifyLink}</div><br><a href="${verifyLink}" target="_blank">🔍 CLICK TO TEST VERIFICATION</a>`,true);}).catch(e=>showMsg('❌ '+e.message,false));}
</script></body></html>
