<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - ARNAUD AFROCHAINE VERIFICATION LTD</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7f6;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      color: #176b45;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      color: #176b45;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      margin-bottom: 16px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #176b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0f5133;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      ARNAUD AFROCHAINE VERIFICATION LTD
    </div>

    <div class="subtitle">
      Secure Administrator Portal
    </div>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        Login
      </button>

      <div id="message"></div>

    </form>

    <div class="footer">
      Authorized administrators only
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",

      authDomain:
        "arnaudafrochaineverification.firebaseapp.com",

      projectId:
        "arnaudafrochaineverification",

      storageBucket:
        "arnaudafrochaineverification.firebasestorage.app",

      messagingSenderId:
        "268502946630",

      appId:
        "1:268502946630:web:c7abe320c83a1d9c3b4b47",

      measurementId:
        "G-Y52LEBJM7Q"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    document
      .getElementById("loginForm")
      .addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        message.style.color = "#333";
        message.textContent = "Logging in...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          message.style.color = "green";
          message.textContent =
            "Login successful. Opening dashboard...";


          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 700);


        } catch (error) {

          console.error(error);

          message.style.color = "red";

          message.textContent =
            "Login failed: " + error.message;

        }

      });

  </script>

</body>
</html>
