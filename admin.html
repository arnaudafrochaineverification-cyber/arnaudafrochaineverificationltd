<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Arnaud</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial;padding:15px;background:#0a4d2e}#login,.box{background:#fff;padding:20px;border-radius:15px;max-width:500px;margin:40px auto;box-shadow:0 4px 15px rgba(0,0,0,.2)}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{width:100%;padding:13px;background:#0a4d2e;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}.idbox{background:#e8f5e9;border:2px dashed #0a4d2e;padding:10px;border-radius:10px;text-align:center;font-weight:900;color:#0a4d2e}#mainBox{display:none}</style>
</head><body>
<div id="login">
<h2 style="color:#0a4d2e;text-align:center">🔐 Admin Login</h2>
<p style="text-align:center;font-size:13px">Enter password to access</p>
<input id="pass" type="password" placeholder="Admin Password">
<button onclick="checkPass()">Unlock Admin</button>
<div id="loginMsg" style="color:red;text-align:center;margin-top:10px"></div>
</div>

<div id="mainBox" class="box">
<h2 style="color:#0a4d2e;text-align:center">Admin - Add Certificate</h2>
<div class="idbox">AUTO ID: <span id="autoID">Loading...</span></div>
<input id="fullName" placeholder="Full Name">
<input id="institution" placeholder="Institution / School">
<input id="course" placeholder="Course">
<input id="grade" placeholder="Grade">
<input id="issueDate" type="date">
<button onclick="addCert()">✅ Save Certificate</button>
<button onclick="genNew()" style="background:#555">🔄 Generate New ID</button>
<div id="msg" style="margin-top:12px"></div>
<p style="text-align:center;margin-top:15px"><a href="index.html">← Back to Verify</a></p>
</div>

<script>
const ADMIN_PASSWORD = "ARNAUD333649"; // <--- Oga you fit change this password here!

function checkPass(){
 if(document.getElementById('pass').value === ADMIN_PASSWORD){
   document.getElementById('login').style.display='none';
   document.getElementById('mainBox').style.display='block';
   genNew();
 } else {
   document.getElementById('loginMsg').innerText="❌ Wrong password Oga!";
 }
}

const cfg={apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",authDomain:"arnaudafrochaineverification.firebaseapp.com",projectId:"arnaudafrochaineverification"};
firebase.initializeApp(cfg);const db=firebase.firestore();
let currentID="";
function genID(){const y=new Date().getFullYear();const r=Math.floor(100+Math.random()*900);return `AAV-${y}-${r}`;}
function genNew(){currentID=genID();document.getElementById('autoID').innerText=currentID;}
async function addCert(){
 const name=document.getElementById('fullName').value.trim(); const inst=document.getElementById('institution').value.trim();
 if(!name||!inst){alert("Enter Name and Institution");return;}
 const data={fullName:name,institution:inst,course:document.getElementById('course').value.trim(),grade:document.getElementById('grade').value.trim(),issueDate:document.getElementById('issueDate').value,certNo:currentID,id:currentID,createdAt:new Date().toISOString()};
 try{await db.collection("certificates").doc(currentID).set(data);document.getElementById('msg').innerHTML=`<div style="background:#e8f5e9;padding:12px;border-radius:10px"><b>✅ SAVED!</b><br>ID: <b>${currentID}</b><br>Name: ${name}</div>`; genNew(); }catch(e){document.getElementById('msg').innerText="Error: "+e.message;}
}
</script></body></html>
