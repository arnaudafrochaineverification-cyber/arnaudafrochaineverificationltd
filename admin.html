<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Arnaud Afrochaine</title><style>body{font-family:Arial;padding:20px;background:#0a192f;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{max-width:400px;width:100%;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.3)}input,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#0a192f;color:white;font-weight:bold;border:none;cursor:pointer}#panel{display:none}.logo{text-align:center;font-weight:bold;color:#0a192f;margin-bottom:15px}</style></head><body>
<div class="box" id="loginBox"><div class="logo">🔒 ARNAUD AFROCHAINE<br>PRIVATE ADMIN</div><p style="text-align:center;color:red;font-size:13px">Authorized Access Only!</p><input type="password" id="pwd" placeholder="Enter Admin Password"><button onclick="login()">UNLOCK ADMIN</button><p id="err" style="color:red;text-align:center"></p></div>
<div class="box" id="panel"><h2>✅ Admin Unlocked</h2><p>Add Certificate</p><input id="cid" placeholder="Certificate ID e.g GML-2024-001"><input id="sch" placeholder="School Name"><input id="stu" placeholder="Student Name"><button onclick="saveCert()" style="background:green">SAVE CERTIFICATE</button><p id="msg" style="color:green"></p><hr><h3>Saved List</h3><div id="list"></div><button onclick="logout()" style="background:#333;margin-top:15px">LOCK ADMIN</button></div>
<script>
const ADMIN_PASSWORD = "Arnaud2024@Admin";
function login(){if(document.getElementById('pwd').value===ADMIN_PASSWORD){document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';show();}else{document.getElementById('err').innerText='❌ Wrong Code! Access Denied!';}}
function saveCert(){let id=document.getElementById('cid').value.trim().toUpperCase();if(!id)return alert('Enter ID');let s=document.getElementById('sch').value;let n=document.getElementById('stu').value;let all=JSON.parse(localStorage.getItem('arnaud_certs')||'{}');all[id]={school:s,name:n,date:new Date().toLocaleDateString()};localStorage.setItem('arnaud_certs',JSON.stringify(all));localStorage.setItem('certs',JSON.stringify(all));document.getElementById('msg').innerText='✅ Saved: '+id;document.getElementById('cid').value='';show();}
function show(){let all=JSON.parse(localStorage.getItem('arnaud_certs')||'{}');let h='';for(let k in all){h+=`<div style="border:1px solid #ddd;padding:8px;margin:5px 0;border-radius:5px"><b>${k}</b><br>${all[k].school} - ${all[k].name}<br><small>${all[k].date}</small> <button onclick="delCert('${k}')" style="width:auto;padding:4px 8px;background:red;margin-left:5px">Delete</button></div>`}document.getElementById('list').innerHTML=h||'No certificate yet';}
function delCert(k){if(!confirm('Delete '+k+'?'))return;let all=JSON.parse(localStorage.getItem('arnaud_certs')||'{}');delete all[k];localStorage.setItem('arnaud_certs',JSON.stringify(all));localStorage.setItem('certs',JSON.stringify(all));show();}
function logout(){document.getElementById('panel').style.display='none';document.getElementById('loginBox').style.display='block';document.getElementById('pwd').value='';}
document.getElementById('pwd').addEventListener('keypress',function(e){if(e.key==='Enter')login();});
</script></body></html>
