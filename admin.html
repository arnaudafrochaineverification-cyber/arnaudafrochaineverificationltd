<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARNAUD ADMIN - MESA FORMAT</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#eef2ee;padding:12px}
.container{max-width:620px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.1);overflow:hidden}
.header{background:#0d6e2f;color:#fff;text-align:center;padding:14px}
.header h2{font-size:16px;line-height:1.3}
.form{padding:18px}
label{font-weight:bold;font-size:12px;color:#333;margin-top:12px;display:block;text-transform:uppercase}
input,select{width:100%;padding:11px;margin-top:4px;border:1px solid #bbb;border-radius:7px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subjects{margin-top:14px;background:#f8f9f0;padding:12px;border-radius:8px;border:1px dashed #0d6e2f}
.subjects h4{font-size:13px;color:#0d6e2f;margin-bottom:8px}
.certDisplay{background:#0d6e2f;color:#fff;text-align:center;padding:12px;border-radius:8px;font-weight:bold;font-size:18px;letter-spacing:1px;margin:10px 0}
.btn{width:100%;padding:15px;background:#0d6e2f;color:#fff;border:0;border-radius:9px;font-weight:bold;font-size:16px;margin-top:18px;cursor:pointer}
.btn:active{transform:scale(0.98)}
#msg{margin-top:14px;padding:12px;border-radius:8px;font-size:13px;display:none;white-space:pre-wrap;word-break:break-word}
.ok{background:#d4edda;border:1px solid #28a745;color:#155724}
.err{background:#f8d7da;border:1px solid #dc3545;color:#721c24}
.qrBox{margin-top:16px;text-align:center;display:none;background:#fff;padding:14px;border:2px solid #0d6e2f;border-radius:10px}
.footer{text-align:center;padding:10px;background:#f1f1f1;font-weight:bold;font-size:12px;color:#0d6e2f}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h2>ARNAUD AFROCHAINE VERIFICATION LTD<br>ADMIN PANEL</h2>
</div>

<div class="form">
<div class="certDisplay" id="certDisplay">AFR-2026-XXXX</div>

<label>FullName: MESA</label>
<input id="fullname" placeholder="e.g MESA JOHN DOE">

<label>Student ID:</label>
<input id="studentId" placeholder="e.g STU-2026-001">

<label>School:</label>
<input id="school" placeholder="e.g University of Lagos">

<label>Certificate N' :</label>
<input id="certificateN" placeholder="Auto - AFR-2026-XXXX" readonly>

<div class="row">
<div>
<label>Examination:</label>
<input id="examination" placeholder="e.g WASSCE / Degree">
</div>
<div>
<label>Course:</label>
<input id="course" placeholder="e.g Computer Science">
</div>
</div>

<div class="row">
<div>
<label>Certificate No:</label>
<input id="certificateNo" placeholder="Auto">
</div>
<div>
<label>IssueDate:</label>
<input id="issueDate" type="date">
</div>
</div>

<div class="row">
<div>
<label>Grade: Distinction</label>
<select id="grade">
<option>Distinction</option>
<option>Upper Credit</option>
<option>Credit</option>
<option>Merit</option>
<option>Pass</option>
</select>
</div>
<div>
<label>Status: AUTHENTIC</label>
<select id="status">
<option>AUTHENTIC</option>
<option>PENDING</option>
<option>FAKE</option>
</select>
</div>
</div>

<div class="subjects">
<h4>--- ADD SUBJECTS ---</h4>
<label>Subject 1:</label>
<input id="sub1" placeholder="e.g Mathematics - A1">
<label>Subject 2:</label>
<input id="sub2" placeholder="e.g English - B2">
<label>Subject 3:</label>
<input id="sub3" placeholder="e.g Physics - A1">
<label>Subject 4:</label>
<input id="sub4" placeholder="e.g Chemistry - B3">
</div>

<label>Issue Date:</label>
<input id="issueDate2" type="date">

<label>Verified On:</label>
<input id="verifiedOn" readonly>

<div class="footer">ARNAUD AFROCHAINE VERIFICATION LTD</div>

<button class="btn" id="saveBtn" onclick="saveAndQR()">[ SAVE + GENERATE QR ]</button>

<div id="msg"></div>

<div class="qrBox" id="qrBox">
<div style="font-weight:bold;color:#0d6e2f;margin-bottom:8px">✅ CERTIFICATE SAVED + QR GENERATED</div>
<div id="qrcode" style="display:flex;justify-content:center"></div>
<div id="qrLink" style="margin-top:10px;font-size:11px;word-break:break-all;background:#f5f5f5;padding:8px;border-radius:6px"></div>
<button onclick="downloadQR()" style="margin-top:10px;padding:8px 14px;background:#0d3d1f;color:#fff;border:0;border-radius:6px">Download QR</button>
</div>

</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};

let db, currentCert="";
firebase.initializeApp(firebaseConfig);
db = firebase.firestore();

const msgEl = document.getElementById('msg');
const qrBox = document.getElementById('qrBox');

function showMsg(t, type){
 msgEl.style.display='block';
 msgEl.textContent=t;
 msgEl.className=type;
}

function genCert(){
 const y=new Date().getFullYear();
 const r=Math.floor(1000+Math.random()*9000);
 currentCert=`AFR-${y}-${r}`;
 document.getElementById('certDisplay').textContent=currentCert;
 document.getElementById('certificateN').value=currentCert;
 document.getElementById('certificateNo').value=currentCert;
 return currentCert;
}

genCert();
const now=new Date();
document.getElementById('issueDate').valueAsDate=now;
document.getElementById('issueDate2').valueAsDate=now;
document.getElementById('verifiedOn').value=now.toLocaleString();

async function saveAndQR(){
 const fullname=document.getElementById('fullname').value.trim();
 const studentId=document.getElementById('studentId').value.trim();
 const school=document.getElementById('school').value.trim();
 const examination=document.getElementById('examination').value.trim();
 const course=document.getElementById('course').value.trim();
 const issueDate=document.getElementById('issueDate').value || document.getElementById('issueDate2').value;
 const grade=document.getElementById('grade').value;
 const status=document.getElementById('status').value;
 const s1=document.getElementById('sub1').value.trim();
 const s2=document.getElementById('sub2').value.trim();
 const s3=document.getElementById('sub3').value.trim();
 const s4=document.getElementById('sub4').value.trim();

 if(!fullname){alert("Enter FullName: MESA"); return;}

 const cert=currentCert;
 const subjects=[s1,s2,s3,s4].filter(Boolean);

 const data={
  fullName:fullname,
  studentId:studentId||"STU-"+Math.floor(Math.random()*10000),
  school:school||"ARNAUD AFROCHAINE VERIFICATION",
  certificateNumber:cert,
  certificateNo:cert,
  certificateN:cert,
  examination:examination||"Certificate Verification",
  course:course||"Security Certification",
  issueDate:issueDate,
  issueDate2:issueDate,
  grade:grade,
  status:status,
  subjects:subjects,
  subject1:s1,subject2:s2,subject3:s3,subject4:s4,
  companyName:"ARNAUD AFROCHAINE VERIFICATION LTD",
  verifiedOn:new Date().toLocaleString(),
  createdAt:firebase.firestore.FieldValue.serverTimestamp()
 };

 const btn=document.getElementById('saveBtn');
 btn.disabled=true;
 btn.textContent="SAVING "+cert+"...";
 showMsg("⏳ Saving "+cert+" to Firebase (default) nam5...\nName: "+fullname,"ok");

 try{
  await db.collection("certificates").doc(cert).set(data);
  const link=`https://arnaudafrochaineverification-cyber.github.io/?id=${cert}`;
  
  showMsg(`✅ SAVED SUCCESSFULLY!\n\nFullName: ${fullname}\nStudent ID: ${data.studentId}\nCertificate N': ${cert}\nSchool: ${data.school}\nExamination: ${data.examination}\nCourse: ${data.course}\nGrade: ${grade}\nStatus: ${status}\n\nLink: ${link}\n\nQR Generated Below!`,"ok");

  // Generate QR
  document.getElementById('qrcode').innerHTML="";
  new QRCode(document.getElementById('qrcode'), {
    text: link,
    width: 180,
    height: 180,
    colorDark : "#0d6e2f",
    colorLight : "#ffffff",
    correctLevel : QRCode.CorrectLevel.H
  });
  document.getElementById('qrLink').textContent=link;
  qrBox.style.display='block';
  
  btn.textContent="[ SAVE + GENERATE QR ]";
  btn.disabled=false;
  genCert();
  document.getElementById('verifiedOn').value=new Date().toLocaleString();

 }catch(e){
  showMsg("❌ FAILED: "+e.message+"\n\nCheck: 1. Rules PUBLISHED (allow read, write: if true)\n2. Internet","err");
  btn.textContent="FAILED - TRY AGAIN";
  btn.disabled=false;
 }
}

function downloadQR(){
 const canvas=document.querySelector('#qrcode canvas');
 if(!canvas){alert("No QR yet");return;}
 const a=document.createElement('a');
 a.download=currentCert+"-QR.png";
 a.href=canvas.toDataURL();
 a.click();
}
</script>
</body>
</html>
