<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Arnaud Full</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial;padding:12px;background:#f0f4f8}#login,.box{background:#fff;padding:18px;border-radius:14px;max-width:520px;margin:20px auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}label{font-weight:bold;font-size:13px;color:#0a3d62;margin-top:10px;display:block}input,select,textarea{width:100%;padding:12px;margin:5px 0 10px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{width:100%;padding:14px;background:#0a4d2e;color:#fff;border:none;border-radius:12px;font-weight:bold;margin-top:12px;cursor:pointer}.idbox{background:#e8f5e9;border:2px dashed #0a4d2e;padding:10px;border-radius:10px;text-align:center;font-weight:900;color:#0a4d2e;margin-bottom:10px}</style>
</head><body>
<div id="login">
<h2 style="color:#0a4d2e;text-align:center">🔐 Admin Login</h2>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="checkPass()">Unlock Admin</button>
<div id="loginMsg" style="color:red;text-align:center;margin-top:10px"></div>
</div>

<div id="mainBox" class="box" style="display:none">
<h2 style="color:#0a4d2e;text-align:center">🔒 Admin - Generate Certificate</h2>
<div class="idbox">AUTO ID: <span id="autoID">Loading...</span></div>

<label>Certificate ID *</label><input id="certId" placeholder="e.g. AA1001">
<label>Full Name *</label><input id="fullName" placeholder="John Doe">
<label>Course *</label><input id="course" placeholder="e.g. Cyber Security">
<label>Institution</label><input id="institution" value="Arnaud Afrochaine Verification Ltd">
<label>Certificate Type</label><select id="certType"><option>Certificate</option><option>Diploma</option><option>Attestation</option></select>
<label>Issue Date</label><input id="issueDate" type="date">
<label>Expiry Date</label><input id="expiryDate" type="date" value="2030-09-19">
<label>Grade / Score</label><input id="grade" placeholder="e.g. 20 / Excellent">
<label>Duration</label><input id="duration" placeholder="e.g. 6 months">
<label>Status</label><select id="status"><option>Completed</option><option>In Progress</option><option>Expired</option></select>
<label>Issued By</label><input id="issuedBy" value="Registrar ARNAUDAFROCHAINVERIFICAT">
<label>Note</label><textarea id="note" placeholder="Additional note"></textarea>

<button onclick="addCert()">💾 SAVE & GENERATE QR</button>
<button onclick="genNew()" style="background:#555">🔄 Generate New ID</button>
<div id="msg" style="margin-top:12px"></div>
<p style="text-align:center"><a href="index.html">← Back to Verify</a></p>
</div>

<script>
const ADMIN_PASSWORD = "ARNAUD333649";
function checkPass(){ if(document.getElementById('pass').value === ADMIN_PASSWORD){ document.getElementById('login').style.display='none'; document.getElementById('mainBox').style.display='block'; genNew(); } else { document.getElementById('loginMsg').innerText="❌ Wrong password!"; } }
const cfg={apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",authDomain:"arnaudafrochaineverification.firebaseapp.com",projectId:"arnaudafrochaineverification"};
firebase.initializeApp(cfg);const db=firebase.firestore();
let currentID=""; function genID(){const y=new Date().getFullYear();const r=Math.floor(100+Math.random()*900);return `AAV-${y}-${r}`;}
function genNew(){currentID=genID();document.getElementById('autoID').innerText=currentID;document.getElementById('certId').value=currentID;}
async function addCert(){
 const cid=document.getElementById('certId').value.trim()||currentID;
 const data={id:cid,certNo:cid,fullName:document.getElementById('fullName').value.trim(),course:document.getElementById('course').value.trim(),institution:document.getElementById('institution').value.trim(),certType:document.getElementById('certType').value,issueDate:document.getElementById('issueDate').value,expiryDate:document.getElementById('expiryDate').value,grade:document.getElementById('grade').value.trim(),duration:document.getElementById('duration').value.trim(),status:document.getElementById('status').value,issuedBy:document.getElementById('issuedBy').value.trim(),note:document.getElementById('note').value.trim(),createdAt:new Date().toISOString()};
 if(!data.fullName||!data.course){alert("Put Full Name and Course");return;}
 try{await db.collection("certificates").doc(cid).set(data);document.getElementById('msg').innerHTML=`<div style="background:#e8f5e9;padding:12px;border-radius:10px"><b>✅ SAVED!</b><br>ID: <b>${cid}</b><br>QR Link: arnaudafrochaineverification.com/verify?id=${cid}</div>`;genNew();}catch(e){document.getElementById('msg').innerText="Error: "+e.message;}
}
</script></body></html>
