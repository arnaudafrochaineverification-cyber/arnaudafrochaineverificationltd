<!-- Add this inside your <script> part -->
<script>
// AUTO CERTIFICATE NUMBER GENERATOR
function generateAutoCertNo() {
  const year = new Date().getFullYear();
  const random = Math.floor(100000 + Math.random() * 900000); // 6 digits
  return `AFR-${year}-${random}`;
}

// When you don login successfully, e go auto fill
firebase.auth().onAuthStateChanged((user) => {
  if (user) {
    document.getElementById('certNo').value = generateAutoCertNo();
  }
});

function refreshCertNo() {
  document.getElementById('certNo').value = generateAutoCertNo();
}
</script>

<!-- For your HTML input, change to this: -->
<div style="display:flex; gap:5px;">
  <input type="text" id="certNo" placeholder="Auto Certificate No" readonly style="background:#e8f5e9; font-weight:bold;">
  <button type="button" onclick="refreshCertNo()" style="background:#0a4a2a; color:white; padding:10px; border-radius:8px;">🔄 NEW</button>
</div>
