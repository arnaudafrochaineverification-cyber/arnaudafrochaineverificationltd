<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARNAUD ADMIN - FINAL FIXED</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:Arial;background:#f0f4f0;padding:15px;margin:0}
.box{max-width:650px;margin:0 auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{text-align:center;color:#0d6e2f;margin:0 0 10px}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:15px}
label{font-weight:bold;font-size:13px;display:block;margin-top:12px}
input,select{width:100%;padding:11px;margin-top:4px;border:1px solid #bbb;border-radius:7px;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:16px;background:#0d6e2f;color:#fff;border:0;border-radius:9px;font-weight:bold;font-size:17px;margin-top:18px}
#log{margin-top:14px;padding:12px;border-radius:8px;font-size:13px;background:#e8f5e9;border:1px solid #28a745;white-space:pre-wrap;word-break:break-word}
.err{background:#f8d7da!important;border-color:#dc3545!important}
.ok{background:#d4edda!important;border-color:#28a745!important}
.warn{background:#fff3cd!important;border-color:#ffc107!important}
.certBox{background:#0d6e2f;color:#fff;padding:12px;border-radius:8px;text-align:center;font-weight:bold;font-size:20px;margin:10px 0}
</style>
</head>
<body>
<div class="box">
<h2>ARNAUD AFROCHAINE<br>ADMIN - FINAL</h2>
<div class="sub">Database: (default) nam5 - 589 reads - Connected ✅</div>
<div class="certBox" id="certDisplay">Loading...</div>
<label>Full Name (MESA):</label>
<input id="fullName" placeholder="e.g MESA JOHN DOE">
<div class="row">
<div><label>Student ID:</label><input id="studentId" placeholder="STU-001"></div>
<div><label>Issue Date:</label><input id="issueDate" type="date"></div>
</div>
<label>School:</label><input id="school" value="ARNAUD AFROCHAINE VERIFICATION">
<div class="row">
<div><label>Examination:</label><input id="examination" value="Certificate Verification"></div>
<div><label>Course:</label><input id="course" value="Security Certification"></div>
</div>
<div class="row">
<div><label>Grade:</label><select id="grade"><option>Distinction</option><option>Upper Credit</option><option>Credit</option></select></div>
<div><label>Status:</label><select id="status"><option>AUTHENTIC</option><option>PENDING</option></select></div>
</div>
<label>Subjects:</label>
<input id="subjects" value="Mathematics - A1, English - B2, Physics - A1, Chemistry - B3">
<button class="btn" id="saveBtn" onclick="saveData()">[ SAVE TO FIREBASE ]</button>
<div id="log">Initializing...</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
let db=null; let currentCert="";
const logEl=document.getElementById('log');
function logMsg(msg,type=''){logEl.textContent=msg; logEl.className=''; if(type) logEl.classList.add(type);}
function genCert(){const y=new Date().getFullYear(); const r=Math.floor(1000+Math.random()*9000); currentCert=`AFR-${y}-${r}`; document.getElementById('certDisplay').textContent=currentCert; return currentCert;}
try{
 firebase.initializeApp(firebaseConfig);
 db=firebase.firestore();
 logMsg("✅ Firebase Ready!\nProject: arnaudafrochaineverification\nDatabase: (default) nam5\nRules: if true (Published)\n\nReady! New Cert: "+genCert()+"\n\nEnter Full Name and click SAVE!",'ok');
 document.getElementById('issueDate').valueAsDate=new Date();
 db.collection("certificates").limit(1).get().then(snap=>{
   logMsg(`✅ Connected! Found ${snap.size} certs in DB.\nReads: 589 total\n\nReady to SAVE: ${currentCert}\nEnter name and click SAVE!`,'ok');
 }).catch(e=>{logMsg("⚠️ Connected but read failed: "+e.message+"\nBut SAVE may still work!\nCert: "+currentCert,'warn');});
}catch(e){logMsg("❌ Init FAILED: "+e.message,'err');}
async function saveData(){
 const fullName=document.getElementById('fullName').value.trim();
 if(!fullName){alert("Enter Full Name!");return;}
 if(!db){logMsg("❌ DB not ready!",'err');return;}
 const cert=currentCert||genCert();
 const data={fullName:fullName,studentId:document.getElementById('studentId').value||"STU-"+Math.floor(Math.random()*10000),school:document.getElementById('school').value,certificateNumber:cert,certificateNo:cert,examination:document.getElementById('examination').value,course:document.getElementById('course').value,issueDate:document.getElementById('issueDate').value,grade:document.getElementById('grade').value,status:document.getElementById('status').value,subjects:document.getElementById('subjects').value.split(',').map(s=>s.trim()),companyName:"ARNAUD AFROCHAINE VERIFICATION LTD",verifiedOn:new Date().toLocaleString(),createdAt:firebase.firestore.FieldValue.serverTimestamp()};
 const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent="SAVING "+cert+"...";
 logMsg(`⏳ SAVING ${cert}...\nName: ${fullName}\nWait 2-5 sec...`,'warn');
 try{
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("TIMEOUT 15s - Check Rules PUBLISHED + Internet")),15000));
  await Promise.race([db.collection("certificates").doc(cert).set(data),timeout]);
  const link=`https://arnaudafrochaineverification-cyber.github.io/?id=${cert}`;
  logMsg(`✅✅✅ SUCCESS! SAVED!\n\nCert: ${cert}\nName: ${fullName}\n\n🔗 LINK:\n${link}\n\nCopy link and open - you will see GREEN VERIFIED!\n\nCheck Firebase Console -> Firestore -> certificates -> you will see ${cert}!\n\nNew number generated for next!`,'ok');
  btn.textContent="SAVED! SAVE NEXT"; btn.disabled=false; genCert();
 }catch(e){
  logMsg(`❌ FAILED!\nCert: ${cert}\nError: ${e.message}\n\nFIX:\n1. Rules page - allow read, write: if true;\n2. Click PUBLISH\n3. Wait 30 sec\n4. Refresh and try again`,'err');
  btn.textContent="FAILED - TRY AGAIN"; btn.disabled=false;
 }
}
</script>
</body>
</html>
