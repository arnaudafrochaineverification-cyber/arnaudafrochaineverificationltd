<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - ARNAUD</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#e8f5e9;padding:15px}.card{background:white;max-width:520px;margin:10px auto;padding:20px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.1)}label{font-weight:bold;color:#0a4d2e;display:block;margin-top:12px;font-size:13px}input,select{width:100%;padding:13px;border:2px solid #c8e6c9;border-radius:10px;margin-top:5px;font-size:14px;background:#f1f8e9}button{width:100%;padding:15px;background:#0a4d2e;color:white;border:none;border-radius:12px;font-weight:bold;margin-top:18px;font-size:16px;cursor:pointer}.out{margin-top:20px;border:2px solid #0a4d2e;padding:15px;border-radius:12px;display:none;text-align:center;background:#f9fbe7}#msg{text-align:center;font-weight:bold;margin-top:10px}</style>
</head><body>
<div class="card">
<h2 style="text-align:center;color:#0a4d2e">Sango Ota - 7 FIELDS + QR</h2>
<label>1. Full Name</label><input id="f1" value="IDOHOU ODJOUMICHI">
<label>2. Institution</label><input id="f2" value="Glory of God">
<label>3. Course</label><input id="f3" value="Security">
<label>4. Certificate Number</label><input id="f4" value="AAV1234">
<label>5. Issue Date</label><input id="f5" type="date" value="2026-09-10">
<label>6. Grade</label><input id="f6" value="20">
<label>7. Status</label><select id="f7"><option>AUTHENTIC</option><option>FAKE</option></select>
<button onclick="save()">💾 SAVE + GENERATE QR</button>
<div id="out" class="out">
<h3 id="o_name" style="color:#0a4d2e"></h3>
<p>Cert: <b id="o_cert"></b></p>
<div id="qrcode" style="display:flex;justify-content:center;margin:15px"></div>
<p id="link" style="font-size:10px;color:blue;word-break:break-all"></p>
<button onclick="window.print()" style="background:#c62828;margin-top:10px">🖨️ PRINT</button>
</div>
<p id="msg"></p>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",authDomain:"arnaudafrochaineverification.firebaseapp.com",projectId:"arnaudafrochaineverification",storageBucket:"arnaudafrochaineverification.firebasestorage.app",messagingSenderId:"268502946630",appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function save(){
let n=document.getElementById('f1').value.trim();
let inst=document.getElementById('f2').value.trim();
let course=document.getElementById('f3').value.trim();
let cert=document.getElementById('f4').value.trim();
let date=document.getElementById('f5').value;
let grade=document.getElementById('f6').value.trim();
let status=document.getElementById('f7').value;
if(!n||!cert){alert('Fill Name and Cert No');return;}
document.getElementById('msg').innerText='⏳ Saving...';document.getElementById('msg').style.color='orange';
db.collection("certificates").doc(cert).set({
studentName:n,
fullname:n,
certNumber:cert,
certnum:cert,
schoolName:inst,
institution:inst,
course:course,
issueDate:date,
issuedate:date,
grade:grade,
status:status,
createdAt:new Date()
}).then(()=>{
document.getElementById('msg').innerText='✅ SAVED! Now test main site';
document.getElementById('msg').style.color='green';
document.getElementById('out').style.display='block';
document.getElementById('o_name').innerText=n;
document.getElementById('o_cert').innerText=cert;
document.getElementById('qrcode').innerHTML='';
let link="https://arnaudafrochaineverification-cyber.github.io/?cert="+encodeURIComponent(cert);
new QRCode(document.getElementById('qrcode'),{text:link,width:190,height:190});
document.getElementById('link').innerText=link;
}).catch(e=>{
document.getElementById('msg').innerText='❌ Error: '+e.message+' -> Go Publish Firebase Rules!';
document.getElementById('msg').style.color='red';
});
}
</script></body></html>
