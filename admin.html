<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnaud Admin - SECRET</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;padding:30px;border-radius:16px;width:100%;max-width:500px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h2{text-align:center;margin-bottom:20px;color:#38bdf8}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-blue{background:#0ea5e9;color:#fff}
.btn-green{background:#22c55e;color:#fff}
.btn-dark{background:#334155;color:#fff}
#adminPanel{display:none}
#qrcode{display:flex;justify-content:center;margin:20px 0;background:#fff;padding:15px;border-radius:10px}
.hidden{display:none}
.success{background:#14532d;color:#bbf7d0;padding:10px;border-radius:8px;text-align:center;margin-top:15px}
</style>
</head>
<body>

<!-- LOGIN - SECRET, NO PIN SHOWN -->
<div class="card" id="loginPanel">
<h2>🔐 Admin Access</h2>
<p style="text-align:center;color:#94a3b8;font-size:14px">Enter your secret password to access database</p>
<input type="password" id="pinInput" placeholder="Enter secret password">
<button class="btn-blue" onclick="unlock()">Unlock Admin</button>
<p id="errorMsg" style="color:#f87171;text-align:center;margin-top:10px;display:none">❌ Wrong password</p>
</div>

<!-- ADMIN - ONLY SHOWS AFTER CORRECT PIN -->
<div class="card" id="adminPanel">
<h2>✅ Arnaud Verification LTD<br><small style="font-size:12px;color:#94a3b8">Secret Database Office</small></h2>

<input type="text" id="certCode" placeholder="Certificate Code e.g. ARNAUD333649" value="ARNAUD333649">
<input type="text" id="fullName" placeholder="Full Name e.g. John Doe">
<input type="text" id="course" placeholder="Course Title e.g. Safety & Security">
<input type="date" id="issueDate">

<button class="btn-blue" onclick="generateCert()">Generate Certificate + QR</button>

<div id="qrSection" class="hidden">
<h3 style="text-align:center">QR Code for Certificate</h3>
<div id="qrcode"></div>
<p style="text-align:center;font-size:12px;color:#94a3b8">Scan this QR to verify</p>
<p id="verifyLink" style="text-align:center;font-size:11px;word-break:break-all;color:#38bdf8"></p>
<button class="btn-dark" onclick="downloadQR()">Download QR Image</button>
</div>

<div id="successMsg" class="hidden success">✅ Added to database! Now download database.json below</div>

<hr style="margin:20px 0;border:0;border-top:1px solid #334155">

<button class="btn-green" onclick="downloadDB()">📥 Download database.json (UPLOAD TO GITHUB)</button>
<button class="btn-dark" onclick="logout()">🔒 Lock Admin</button>

<h4 style="margin-top:20px">Current Database (<span id="count">0</span>)</h4>
<div id="dbList" style="font-size:12px;max-height:150px;overflow-y:auto;background:#0f172a;padding:10px;border-radius:8px"></div>
</div>

<script>
const SECRET_PIN = "ARNAUD333649";
let database = JSON.parse(localStorage.getItem('arnaud_db') || '{}');
let currentQR = null;

function unlock(){
  const entered = document.getElementById('pinInput').value.trim();
  if(entered === SECRET_PIN){
    document.getElementById('loginPanel').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    loadDB();
  } else {
    document.getElementById('errorMsg').style.display='block';
  }
}

function logout(){
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('loginPanel').style.display='block';
  document.getElementById('pinInput').value='';
}

function generateCert(){
  const code = document.getElementById('certCode').value.trim();
  const name = document.getElementById('fullName').value.trim();
  const course = document.getElementById('course').value.trim();
  const date = document.getElementById('issueDate').value || new Date().toISOString().split('T')[0];

  if(!code ||!name ||!course){ alert('Fill all fields boss!'); return; }

  database[code] = { fullName: name, course: course, issueDate: date, status: "VALID" };
  localStorage.setItem('arnaud_db', JSON.stringify(database));

  // Generate QR
  document.getElementById('qrSection').classList.remove('hidden');
  document.getElementById('qrcode').innerHTML='';
  const verifyUrl = `https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify.html?code=${code}`;
  document.getElementById('verifyLink').innerText = verifyUrl;

  new QRCode(document.getElementById('qrcode'), {
    text: verifyUrl,
    width: 200,
    height: 200
  });

  document.getElementById('successMsg').classList.remove('hidden');
  loadDB();
}

function loadDB(){
  document.getElementById('count').innerText = Object.keys(database).length;
  let html = '';
  for(let code in database){
    html += `<div>✅ <b>${code}</b> - ${database[code].fullName}</div>`;
  }
  document.getElementById('dbList').innerHTML = html || 'No certificates yet';
}

function downloadDB(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(database, null, 2));
  const a = document.createElement('a');
  a.href = dataStr;
  a.download = "database.json";
  a.click();
  alert('Now go to GitHub > Upload this database.json > Commit changes. After 2 mins, your certificates will be LIVE!');
}

function downloadQR(){
  const canvas = document.querySelector('#qrcode canvas');
  if(!canvas) return alert('Generate QR first');
  const a = document.createElement('a');
  a.href = canvas.toDataURL();
  a.download = document.getElementById('certCode').value + "_QR.png";
  a.click();
}

// auto set today
document.getElementById('issueDate').valueAsDate = new Date();
</script>
</body>
</html>
