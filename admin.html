<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARNAUD ADMIN - BLACK QR + PDF</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#eef2ee;padding:12px}
.box{max-width:620px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.header{background:#0d6e2f;color:#fff;text-align:center;padding:14px}
.form{padding:18px}
label{font-weight:bold;font-size:12px;margin-top:12px;display:block}
input,select{width:100%;padding:11px;margin-top:4px;border:1px solid #bbb;border-radius:7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{background:#f8f9f0;padding:12px;border-radius:8px;border:1px dashed #0d6e2f;margin-top:14px}
.cert{background:#000;color:#fff;text-align:center;padding:12px;border-radius:8px;font-weight:bold;font-size:18px;margin:10px 0}
.btn{width:100%;padding:15px;background:#0d6e2f;color:#fff;border:0;border-radius:9px;font-weight:bold;margin-top:14px}
#msg{margin-top:12px;padding:12px;border-radius:8px;font-size:13px;display:none;white-space:pre-wrap}
.ok{background:#d4edda;border:1px solid #28a745}
.err{background:#f8d7da;border:1px solid #dc3545}
.qrBox{margin-top:16px;text-align:center;display:none;background:#fff;padding:14px;border:2px solid #000;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<div class="header"><h2>ARNAUD AFROCHAINE VERIFICATION LTD<br>ADMIN PANEL - BLACK QR</h2></div>
<div class="form">
<div class="cert" id="certDisplay">AFR-2026-XXXX</div>

<label>FullName:</label>
<input id="fullname" placeholder="e.g MESA JOHN DOE">

<label>Student ID:</label>
<input id="studentId" placeholder="e.g STU-2026-001">

<label>School:</label>
<input id="school" placeholder="e.g University of Lagos">

<label>Certificate N' :</label>
<input id="certificateN" readonly>

<div class="row">
<div><label>Examination:</label><input id="examination" placeholder="WASSCE / Degree"></div>
<div><label>Course:</label><input id="course" placeholder="Computer Science"></div>
</div>

<div class="row">
<div><label>Certificate No:</label><input id="certificateNo" readonly></div>
<div><label>IssueDate:</label><input id="issueDate" type="date"></div>
</div>

<div class="row">
<div><label>Grade: Distinction</label><select id="grade"><option>Distinction</option><option>Upper Credit</option><option>Credit</option><option>Merit</option><option>Pass</option></select></div>
<div><label>Status: AUTHENTIC</label><select id="status"><option>AUTHENTIC</option><option>PENDING</option></select></div>
</div>

<div class="sub">
<h4>--- ADD SUBJECTS ---</h4>
<label>Subject 1:</label><input id="sub1">
<label>Subject 2:</label><input id="sub2">
<label>Subject 3:</label><input id="sub3">
<label>Subject 4:</label><input id="sub4">
</div>

<label>Issue Date:</label><input id="issueDate2" type="date">
<label>Verified On:</label><input id="verifiedOn" readonly>

<button class="btn" id="saveBtn" onclick="saveAndQR()">[ SAVE + GENERATE QR ]</button>
<div id="msg"></div>

<div class="qrBox" id="qrBox">
<div style="font-weight:bold">✅ SAVED - BLACK QR GENERATED</div>
<div id="qrcode" style="display:flex;justify-content:center;margin-top:10px"></div>
<div id="qrLink" style="margin-top:10px;font-size:11px;background:#f5f5f5;padding:8px;word-break:break-all"></div>
<button onclick="downloadQR()" style="width:100%;margin-top:10px;padding:10px;background:#000;color:#fff;border:0;border-radius:6px;font-weight:bold">⬇️ Download BLACK QR</button>
<button onclick="downloadPDF()" style="width:100%;margin-top:10px;padding:12px;background:#dc3545;color:#fff;border:0;border-radius:6px;font-weight:bold">📄 DOWNLOAD CERTIFICATE PDF</button>
