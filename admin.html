<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Arnaud AfroChaine</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.box{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto}
input{width:95%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:12px;background:black;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold}
#loginBox{display:block} #adminBox{display:none}
</style>
</head>
<body>
<div class="box">
<div id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">LOGIN</button>
</div>
<div id="adminBox">
<h2>Add Certificate</h2>
<input type="text" id="cid" placeholder="Certificate ID e.g AAC/2026/005">
<input type="text" id="cname" placeholder="Student Full Name">
<input type="text" id="ccourse" placeholder="Course e.g Afro Dance">
<button onclick="saveCert()">SAVE CERTIFICATE ONLINE</button>
<div id="msg" style="margin-top:15px;font-weight:bold"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function login(){
  if(document.getElementById('pass').value === "ARNAUD333649"){
    document.getElementById('loginBox').style.display="none";
    document.getElementById('adminBox').style.display="block";
  }else{ alert("Wrong password!"); }
}

async function saveCert(){
  const id = document.getElementById('cid').value.trim();
  const name = document.getElementById('cname').value.trim();
  const course = document.getElementById('ccourse').value.trim();
  const m = document.getElementById('msg');
  if(!id || !name){ m.innerHTML="❌ Fill ID and Name"; return; }
  m.innerHTML="⏳ Saving...";
  try{
    await db.collection("certificates").doc(id).set({
      name: name,
      course: course,
      date: new Date().toLocaleDateString()
    });
    m.innerHTML = `✅ SAVED ONLINE! Certificate ${id} is now LIVE!`;
    m.style.color="green";
  }catch(e){
    m.innerHTML="❌ Error: "+e.message;
  }
}
</script>
</body>
</html>
