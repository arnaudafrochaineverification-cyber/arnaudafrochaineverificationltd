<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - ARNAUD AFROCHAINE NO.1 ANTI-FAKE</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:Arial;background:#e8f5e9;padding:15px}
.card{background:white;max-width:520px;margin:10px auto;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
h2{text-align:center;color:#0a4d2e;margin-bottom:5px}
.sub{text-align:center;color:#d4af37;font-weight:bold;font-size:12px;letter-spacing:2px;margin-bottom:15px}
label{font-weight:bold;color:#0a4d2e;display:block;margin-top:12px;font-size:13px}
input,select{width:100%;padding:13px;border:2px solid #c8e6c9;border-radius:10px;margin-top:5px;font-size:14px;background:#f1f8e9;box-sizing:border-box}
button{width:100%;padding:15px;background:#0a4d2e;color:gold;border:none;border-radius:12px;font-weight:bold;margin-top:18px;font-size:16px;cursor:pointer;letter-spacing:1px}
.out{margin-top:20px;border:2px solid #0a4d2e;padding:15px;border-radius:12px;display:none;text-align:center;background:#f9fbe7}
#msg{text-align:center;font-weight:bold;margin-top:12px;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h2>Sango Ota - 7 FIELDS + QR</h2>
<div class="sub">ARNAUD AFROCHAINE VERIFICATION LTD • NO.1 ANTI-FAKE WORLDWIDE</div>

<label>1. Full Name *</label><input id="f1" placeholder="e.g. SAGBOHAN OBINNA">
<label>2. Institution *</label><input id="f2" value="Glory of God">
<label>3. Course *</label><input id="f3" placeholder="e.g. Security Training">
<label>4. Certificate Number *</label><input id="f4" placeholder="e.g. AA-2025-001">
<label>5. Issue Date *</label><input id="f5" type="date">
<label>6. Grade / Score</label><input id="f6" placeholder="e.g. Distinction / 85%">
<label>7. Status *</label><select id="f7"><option value="AUTHENTIC">AUTHENTIC ✅</option><option value="FAKE">FAKE ❌</option></select>

<button onclick="save()">💾 SAVE + GENERATE QR CODE</button>

<div id="out" class="out">
<h3 id="o_name" style="color:#0a4d2e;margin:5px"></h3>
<p>Cert No: <b id="o_cert" style="color:#b8960c"></b></p>
<div id="qrcode" style="display:flex;justify-content:center;margin:15px"></div>
<p id="link" style="font-size:10px;color:blue;word-break:break-all;background:white;padding:8px;border-radius:5px"></p>
<p style="font-size:11px;color:#0a4d2e;">✅ Scan QR to verify - goes to public portal</p>
<button onclick="window.print()" style="background:#c62828;margin-top:10px">🖨️ PRINT THIS QR</button>
</div>
<p id="msg"></p>
</div>

<script>
// Firebase Config
const firebaseConfig={
apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
authDomain:"arnaudafrochaineverification.firebaseapp.com",
projectId:"arnaudafrochaineverification",
storageBucket:"arnaudafrochaineverification.firebasestorage.app",
messagingSenderId:"268502946630",
appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

// Set today's date
document.getElementById('f5').valueAsDate = new Date();

function save(){
let n=document.getElementById('f1').value.trim();
let inst=document.getElementById('f2').value.trim();
let course=document.getElementById('f3').value.trim();
let cert=document.getElementById('f4').value.trim().toUpperCase();
let date=document.getElementById('f5').value;
let grade=document.getElementById('f6').value.trim();
let status=document.getElementById('f7').value;

if(!n||!cert||!inst||!course||!date){
alert('Oga please fill all fields with *');return;
}

let msgBox=document.getElementById('msg');
msgBox.innerText='⏳ Saving to Firebase...';
msgBox.style.color='orange';
msgBox.style.background='#fff3e0';

db.collection("certificates").doc(cert).set({
studentName:n,
fullname:n,
name:n,
certNumber:cert,
certnum:cert,
id:cert,
schoolName:inst,
institution:inst,
course:course,
issueDate:date,
issuedate:date,
grade:grade,
status:status,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
}).then(()=>{
msgBox.innerText='✅ SAVED SUCCESSFULLY! QR Generated! Now test on main site: arnaudafrochaineverificationltd';
msgBox.style.color='green';
msgBox.style.background='#e8f5e9';

document.getElementById('out').style.display='block';
document.getElementById('o_name').innerText=n;
document.getElementById('o_cert').innerText=cert;
document.getElementById('qrcode').innerHTML='';

// THIS IS THE CORRECTED LINK - MATCHES YOUR PUBLIC PORTAL
let link="https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/?id="+encodeURIComponent(cert);

new QRCode(document.getElementById('qrcode'),{
text:link,
width:200,
height:200,
colorDark:"#0a4d2e",
colorLight:"#ffffff",
correctLevel: QRCode.CorrectLevel.H
});

document.getElementById('link').innerText=link;

}).catch(e=>{
msgBox.innerText='❌ Error: '+e.message+'\n\nGo Firebase Console -> Firestore -> Rules -> Change to allow read, write: if true -> Publish!';
msgBox.style.color='red';
msgBox.style.background='#ffebee';
});
}
</script>
</body>
</html>
