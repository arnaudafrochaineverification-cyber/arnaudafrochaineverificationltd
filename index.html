<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnaud - 11 Fill Generate</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
function makeId(){ return "AAC-" + new Date().getFullYear() + "-" + Math.floor(100000 + Math.random()*900000); }
window.generate = async function(){
  const fullName = document.getElementById('f1').value.trim();
  if(!fullName){ alert("Put Full Name!"); return; }
  const id = makeId();
  document.getElementById('show').innerHTML = "⏳ Saving " + id + "...";
  const data = {
    fullName: fullName,
    course: document.getElementById('f2').value || "N/A",
    institution: document.getElementById('f3').value || "Arnaud Afrochaine Verification Ltd",
    duration: document.getElementById('f4').value || "N/A",
    grade: document.getElementById('f5').value || "Excellent",
    certificateType: document.getElementById('f6').value || "Training Certificate",
    issueDate: document.getElementById('f7').value || new Date().toLocaleDateString(),
    email: document.getElementById('f8').value || "N/A",
    phone: document.getElementById('f9').value || "N/A",
    location: document.getElementById('f10').value || "Port Harcourt",
    issuedBy: document.getElementById('f11').value || "Arnaud Afrochaine - No.1 Anti-Fake",
    expiryDate: "No Expiry",
    status: "Verified",
    createdAt: new Date().toISOString()
  };
  try{
    await setDoc(doc(db, "certificates", id), data);
    const link = "https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify.html?cert=" + encodeURIComponent(id);
    document.getElementById('show').innerHTML = `<div style="background:#e8f5e9;border:2px solid green;padding:15px;border-radius:10px;text-align:center"><h3 style="color:green">✅ SAVED! 11 FILL DONE!</h3><p><b>ID:</b> ${id}<br><b>Name:</b> ${fullName}<br><b>Email:</b> ${data.email}<br><b>Phone:</b> ${data.phone}</p><div id="qr" style="display:flex;justify-content:center;margin:12px 0"></div><p style="font-size:10px;word-break:break-all">${link}</p><a href="${link}" target="_blank"><button style="background:#0b3a5f">TEST VERIFY - FULL NAME GO SHOW</button></a><button onclick="downQR()" style="background:#ff6b00;margin-top:8px">DOWNLOAD QR</button><button onclick="location.reload()" style="background:#666;margin-top:8px">NEXT CERTIFICATE</button></div>`;
    new QRCode(document.getElementById("qr"), {text: link, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.H});
    window.myId = id;
  }catch(e){ document.getElementById('show').innerHTML = "<p style=color:red>"+e.message+"</p>"; }
}
window.downQR = function(){ const c=document.querySelector("#qr canvas"); const a=document.createElement("a"); a.download="QR-"+window.myId+".png"; a.href=c.toDataURL(); a.click(); }
</script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.top{background:#0b3a5f;color:#fff;padding:12px;text-align:center}
.box{max-width:520px;margin:12px auto;background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
input{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
label{font-size:11px;font-weight:bold;color:#0b3a5f;margin-top:6px;display:block}
button{width:100%;padding:13px;background:#0b4d2e;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:12px;font-size:15px}
</style>
</head>
<body>
<div class="top"><b>ARNAUD AFROCHAINE</b><br><span style="font-size:11px;color:#ff9">11-FILL AUTO ID + QR - NO.1 ANTI-FAKE</span></div>
<div class="box">
<h3 style="text-align:center;margin:0 0 10px 0">Generate Certificate (11 Fill)</h3>
<label>1. Full Name *</label><input id="f1" placeholder="e.g John Doe">
<label>2. Course</label><input id="f2" placeholder="e.g Cyber Security">
<label>3. Institution</label><input id="f3" placeholder="e.g Arnaud Afrochaine Ltd">
<label>4. Duration</label><input id="f4" placeholder="e.g 3 Months">
<label>5. Grade</label><input id="f5" placeholder="e.g Excellent">
<label>6. Certificate Type</label><input id="f6" placeholder="e.g Training Certificate">
<label>7. Issue Date</label><input id="f7" type="date">
<label>8. Student Email</label><input id="f8" placeholder="e.g john@gmail.com">
<label>9. Phone Number</label><input id="f9" placeholder="e.g 08012345678">
<label>10. Location / Center</label><input id="f10" placeholder="e.g Port Harcourt">
<label>11. Issued By</label><input id="f11" placeholder="e.g Arnaud Afrochaine">
<button onclick="generate()">GENERATE 11-FILL + AUTO ID + QR</button>
<div id="show" style="margin-top:15px"></div>
<p style="font-size:10px;text-align:center;color:green;margin-top:10px">🔒 Auto ID like AAC-2026-847392 | Full Name + 11 fill go show when scan QR!</p>
</div>
</body>
</html>
