<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arnaud Afrochaine Verification - Official Portal</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
body{font-family:Arial;background:#0a4d2e;margin:0;padding:15px;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:white;max-width:500px;width:100%;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
h1{color:#0a4d2e;margin:0 0 5px 0;font-size:22px}
.sub{color:#d4af37;font-weight:bold;font-size:11px;letter-spacing:1px;margin-bottom:20px}
.status{padding:20px;border-radius:15px;margin:15px 0;font-weight:bold;font-size:16px}
.ok{background:#e8f5e9;color:#1b5e20;border:3px solid #2e7d32}
.bad{background:#ffebee;color:#b71c1c;border:3px solid #c62828}
.info{text-align:left;background:#f9fbe7;padding:15px;border-radius:10px;margin:15px 0;line-height:1.8;border-left:5px solid #0a4d2e}
.info b{color:#0a4d2e}
#load{color:#0a4d2e}
</style>
</head>
<body>
<div class="box">
<h1>ARNAUD AFROCHAINE VERIFICATION LTD</h1>
<div class="sub">SANGO OTA • NO.1 ANTI-FAKE WORLDWIDE • OFFICIAL PORTAL</div>
<div id="load">⏳ Verifying Certificate... Please wait</div>
<div id="result" style="display:none"></div>
<p style="font-size:11px;color:#777;margin-top:20px">Official Verification Portal<br>arnaudafrochaineverification-cyber.github.io<br>© 2026 Arnaud Afrochaine Ltd</p>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
authDomain:"arnaudafrochaineverification.firebaseapp.com",
projectId:"arnaudafrochaineverification",
storageBucket:"arnaudafrochaineverification.firebasestorage.app",
messagingSenderId:"268502946630",
appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function getId(){
let p=new URLSearchParams(window.location.search);
return p.get('id') || p.get('cert') || p.get('certnum') || p.get('certNumber') || p.get('q');
}

let certId=getId();
if(!certId){
document.getElementById('load').innerHTML='<div class="status bad">❌ NO CERTIFICATE ID<br><br>Please scan QR code from certificate</div>';
}else{
certId=certId.toUpperCase().trim();
db.collection("certificates").doc(certId).get().then(doc=>{
document.getElementById('load').style.display='none';
let r=document.getElementById('result');
r.style.display='block';
if(doc.exists){
let d=doc.data();
let name=d.fullname||d.studentName||d.name||'N/A';
let inst=d.institution||d.schoolName||'N/A';
let course=d.course||'N/A';
let cert=d.certNumber||d.certnum||doc.id;
let date=d.issueDate||d.issuedate||'N/A';
let grade=d.grade||'N/A';
let status=(d.status||'AUTHENTIC').toUpperCase();
let isAuth=status.includes('AUTH');

r.innerHTML=`
<div class="status ${isAuth?'ok':'bad'}">${isAuth?'✅ VERIFIED AUTHENTIC - NOT FAKE':'❌ FAKE / NOT FOUND'}</div>
<div class="info">
<b>Full Name:</b> ${name}<br>
<b>Institution:</b> ${inst}<br>
<b>Course:</b> ${course}<br>
<b>Certificate No:</b> <span style="color:black;font-size:18px">${cert}</span><br>
<b>Grade:</b> ${grade}<br>
<b>Issue Date:</b> ${date}<br>
<b>Status:</b> <b style="color:${isAuth?'green':'red'}">${status}</b>
</div>
<p style="font-size:13px;color:${isAuth?'green':'red'};font-weight:bold">${isAuth?'✔ This certificate is REAL and registered by Arnaud Afrochaine Ltd':'✖ This certificate NOT found - Possible FAKE'}</p>
`;
}else{
r.innerHTML=`<div class="status bad">❌ CERTIFICATE NOT FOUND<br><br>Cert No: ${certId}<br><br>This may be FAKE or not yet registered</div>`;
}
}).catch(e=>{
document.getElementById('load').innerHTML='<div class="status bad">⚠️ Network Error<br>'+e.message+'</div>';
});
}
</script>
</body>
</html>
