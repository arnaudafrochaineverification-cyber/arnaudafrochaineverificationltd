<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.check = async function () {

  const raw = document
    .getElementById("cert")
    .value
    .trim()
    .toUpperCase();

  const resDiv = document.getElementById("res");

  if (!raw) {
    resDiv.style.display = "block";
    resDiv.innerHTML = `
      <div style="padding:15px;background:#ffebee;text-align:center">
        ❌ Please enter a certificate reference.
      </div>`;
    return;
  }

  resDiv.style.display = "block";
  resDiv.innerHTML = `
    <div style="padding:20px;text-align:center;background:#fff8e1">
      ⏳ Checking certificate... ${raw}
    </div>`;

  try {

    const q = query(
      collection(db, "certificates"),
      where("ref", "==", raw)
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {

      resDiv.innerHTML = `
        <div style="padding:20px;background:#ffebee;text-align:center">
          <b>❌ CERTIFICATE NOT FOUND</b><br><br>
          Reference <b>${raw}</b> could not be found in the verification database.
          <br><br>
          Please check the certificate reference and try again.
        </div>`;

      return;
    }

    const snap = snapshot.docs[0];
    const d = snap.data();

    const status = d.status || "VERIFIED";
    const fullName = d.fullName || d.name || "Not provided";
    const certificateType =
      d.certificateType || d.course || d.docType || "Certificate";
    const certificateNumber =
      d.certificateNumber || d.certNo || "Not provided";
    const issuer =
      d.school || d.issuer || "Not provided";
    const issueDate =
      d.issueDate || d.dateVerified || "Not provided";
    const reference =
      d.ref || raw;

    const publicVerifyUrl =
      "https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/?id=" +
      encodeURIComponent(reference);

    const qrUrl =
      "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
      encodeURIComponent(publicVerifyUrl);

    resDiv.innerHTML = `
      <div style="background:white">

        <div style="
          background:#0a4d2a;
          color:white;
          padding:12px;
          text-align:center;
          font-weight:900;
          margin:8px;
          border-radius:8px">
          ✅ ${status}
        </div>

        <div style="
          padding:14px;
          line-height:2.2;
          font-size:13px">

          <b>Reference:</b> ${reference}<br>
          <b>Name:</b> ${fullName}<br>
          <b>Document:</b> ${certificateType}<br>
          <b>Certificate No:</b> ${certificateNumber}<br>
          <b>Issuing Institution:</b> ${issuer}<br>
          <b>Issue Date:</b> ${issueDate}<br>
          <b>Verification Source:</b> ARNAUD AFROCHAINE VERIFICATION LTD

        </div>

        <div style="
          margin:14px;
          border:2px dashed #0a4d2a;
          padding:12px;
          text-align:center;
          border-radius:12px">

          <div style="
            font-weight:800;
            color:#0a4d2a">
            📱 QR VERIFICATION
          </div>

          <img
            src="${qrUrl}"
            alt="QR Verification"
            style="margin:10px 0;width:200px;height:200px">

          <div style="
            font-size:9px;
            word-break:break-all">
            ${publicVerifyUrl}
          </div>

        </div>

      </div>`;

    resDiv.scrollIntoView({
      behavior: "smooth"
    });

  } catch (error) {

    console.error(error);

    resDiv.innerHTML = `
      <div style="
        padding:20px;
        background:#ffebee;
        text-align:center">

        ❌ Verification service error.<br><br>
        Please try again later.

      </div>`;
  }
};
</script>
