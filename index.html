<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arnaud Afrochaine Verification LTD</title>
<link rel="icon" href="./IMG-20260917-WA1432.jpg">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
body{font-family:'Poppins',Arial,sans-serif;text-align:center;padding:12px;background:linear-gradient(135deg,#f0f7f0 0%,#e8f5e8 100%);margin:0;min-height:100vh}
.box{background:white;max-width:440px;margin:20px auto;padding:30px 25px;border-radius:20px;box-shadow:0 12px 40px rgba(10,92,44,0.15);border:1px solid rgba(212,175,55,0.2)}
.logo{width:220px;height:220px;object-fit:contain;margin:0 auto 15px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.1))}
h2{color:#0a5c2c;margin:8px 0 4px;font-size:24px;font-weight:700}
.tagline{color:#8a6d00;font-size:11px;letter-spacing:2.5px;font-weight:600;margin-bottom:5px;text-transform:uppercase}
.slogan{color:#0a5c2c;font-size:12px;font-style:italic;opacity:0.8;margin-bottom:22px}
input{width:92%;padding:15px 14px;margin:12px 0;border:2px solid #e0e8e0;border-radius:12px;font-size:16px;font-family:inherit;text-transform:uppercase;transition:all 0.3s;outline:none}
input:focus{border-color:#0a8a43;box-shadow:0 0 0 4px rgba(10,138,67,0.1)}
button{width:96%;padding:15px;background:linear-gradient(135deg,#0a5c2c,#0a8a43);color:white;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:0.5px;box-shadow:0 6px 18px rgba(10,92,44,0.3);margin:6px 0;transition:all 0.2s}
button:hover{transform:translateY(-1px)}
.btn-qr{background:linear-gradient(135deg,#b8941f,#d4af37);color:#0a3d1f}
#reader{width:100%;margin-top:15px;border-radius:12px;overflow:hidden;display:none}
#result{margin-top:22px;padding:20px;border-radius:12px;display:none;text-align:left;font-size:14px;line-height:1.6}
.valid{background:linear-gradient(135deg,#e8f5e9,#d4edda);color:#0a3d1f;border:2px solid #81c784}
.invalid{background:linear-gradient(135deg,#ffebee,#ffcdd2);color:#6a1b1b;border:2px solid #e57373}
.badge{display:inline-block;background:#0a5c2c;color:#d4af37;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.footer{margin-top:28px;padding-top:18px;border-top:1px solid #eee;font-size:10px;color:#999}
.gold{color:#b8941f;font-weight:700}
</style>
</head>
<body>
<div class="box">
<img src="./IMG-20260917-WA1432.jpg" class="logo" alt="Arnaud Logo">
<h2>Certificate Verification</h2>
<div class="tagline">Arnaud Afrochaine Verification LTD</div>
<div class="slogan">African Roots, Global Vision</div>

<input type="text" id="certId" placeholder="ENTER CERTIFICATE ID">
<button onclick="verify()">🔍 VERIFY CERTIFICATE</button>
<button class="btn-qr" onclick="startQr()">📷 SCAN QR CODE</button>

<div id="reader"></div>
<div id="result"></div>

<div class="footer">
<span class="gold">Secure • Trusted • Global</span><br>
Official Verification Portal<br>
© 2025 Arnaud Afrochaine Verification LTD
</div>
</div>

<script>
let html5QrcodeScanner;

async function verify(){
  let raw = document.getElementById('certId').value.trim();
  let id = raw.toUpperCase().replace(/\s+/g,'-').replace(/--+/g,'-');
  const resDiv = document.getElementById('result');
  if(!id){resDiv.style.display='block';resDiv.className='invalid';resDiv.innerHTML='❌ Please enter a valid Certificate ID';return;}
  resDiv.style.display='block';resDiv.innerHTML='⏳ Verifying from secure global database...';
  try{
    const response = await fetch('./database.json?v='+Date.now());
    const db = await response.json();
    if(db[id]){
      resDiv.className='valid';
      resDiv.innerHTML=`<div class="badge">✓ VERIFIED</div><br><b style="font-size:17px;color:#0a5c2c">VALID CERTIFICATE</b><br><br><b>🏫 School:</b> ${db[id].school}<br><b>👤 Name:</b> ${db[id].student}<br><b>📅 Year:</b> ${db[id].year}<br><b>🆔 ID:</b> ${id}<br><br><div style="text-align:center;margin-top:12px;padding:14px;background:rgba(255,255,255,0.7);border-radius:8px;border:1px dashed #81c784"><span style="font-size:20px">✅</span><br><b style="color:#0a5c2c">Authenticated by</b><br><b>Arnaud Afrochaine Verification LTD</b><br><small>African Roots, Global Vision<br>${new Date().toLocaleString()}</small></div>`;
    }else{
      resDiv.className='invalid';
      resDiv.innerHTML=`<b style="font-size:16px">❌ INVALID CERTIFICATE</b><br><br>ID <b>${id}</b> not found.<br><br><small>Contact: support@arnaudafrochaine.com</small>`;
    }
  }catch(e){
    resDiv.className='invalid';
    resDiv.innerHTML='⚠️ Network error. Check connection.';
  }
}

function startQr(){
  const readerDiv = document.getElementById('reader');
  readerDiv.style.display='block';
  html5QrcodeScanner = new Html5Qrcode("reader");
  html5QrcodeScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    (decodedText) => {
      document.getElementById('certId').value = decodedText;
      html5QrcodeScanner.stop().then(()=>{readerDiv.style.display='none'; verify();});
    },
    (error) => {}
  ).catch(err=>{
    document.getElementById('result').style.display='block';
    document.getElementById('result').className='invalid';
    document.getElementById('result').innerHTML='❌ Camera error: '+err;
  });
}
document.getElementById('certId').addEventListener('keypress',function(e){if(e.key==='Enter'){verify()}});
</script>
</body>
</html>
