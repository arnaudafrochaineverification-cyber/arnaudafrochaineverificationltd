<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arnaud Afrochaine Verification LTD</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
body{font-family:Poppins,sans-serif;background:#f0f7f0;margin:0;padding:10px;text-align:center}
.box{background:white;max-width:500px;margin:20px auto;padding:25px;border-radius:20px;box-shadow:0 12px 40px rgba(10,92,44,0.15)}
input{width:90%;padding:14px;margin:10px 0;border:2px solid #e0e8e0;border-radius:12px;font-size:16px;text-transform:uppercase;text-align:center}
button{width:94%;padding:14px;background:#0a5c2c;color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin:6px 0}
#result{margin-top:20px;padding:20px;border-radius:15px;display:none}
.valid{background:#d4edda;border:3px solid #0a5c2c;animation:flash 0.8s ease-in-out 3}
.invalid{background:#f8d7da;border:3px solid #c0392b}
@keyframes flash{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(10,92,44,0.4)}50%{transform:scale(1.03);box-shadow:0 0 25px rgba(10,92,44,0.8)}}
</style>
</head>
<body>
<div class="box">
<img src="./IMG-20260917-WA1432.jpg" style="width:110px;height:110px;object-fit:contain;border-radius:50%">
<h2 style="color:#0a5c2c;margin:5px 0">ARNAUD AFROCHAINE</h2>
<p style="color:#d4af37;font-weight:700;margin:0">VERIFICATION LTD</p>
<hr>
<input type="text" id="certId" placeholder="ENTER CERTIFICATE ID">
<button onclick="verify()">🔍 VERIFY CERTIFICATE</button>
<button style="background:#d4af37;color:#0a3d1f" onclick="startScan()">📷 SCAN QR CODE</button>
<div id="reader" style="margin-top:15px"></div>
<div id="result"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let db=[];
fetch('./database.json').then(r=>r.json()).then(d=>{db=d;autoVerifyFromURL();});

function autoVerifyFromURL(){
let params=new URLSearchParams(window.location.search);
let id=params.get('id');
if(id){
id=id.trim().toUpperCase();
document.getElementById('certId').value=id;
setTimeout(()=>verify(),500);
}
}

function verify(){
let id=document.getElementById('certId').value.trim().toUpperCase().replace(/\s+/g,'-');
if(!id){alert('Enter ID');return;}
let found=db.find(s=>s.id.toUpperCase()===id);
let res=document.getElementById('result');
res.style.display='block';
if(found){
res.className='valid';
res.innerHTML=`<h1 style="color:#0a5c2c;margin:0;font-size:28px">✅ VALID CERTIFICATE</h1><div style="font-size:50px;margin:10px 0">🎓</div><h3 style="color:#0a5c2c">${found.name}</h3><p><b>ID:</b> ${found.id}</p><p><b>Course:</b> ${found.course||'Completed'}</p><p><b>Date:</b> ${found.date||''}</p><p style="color:#0a5c2c;font-weight:700;margin-top:15px">✓ Verified by Arnaud Afrochaine Verification LTD</p>`;
window.scrollTo(0,document.body.scrollHeight);
}else{
res.className='invalid';
res.innerHTML=`<h2 style="color:#c0392b">❌ INVALID CERTIFICATE</h2><p>ID <b>${id}</b> not found in database.</p>`;
}
}

function startScan(){
let reader=new Html5Qrcode("reader");
reader.start({facingMode:"environment"},{fps:10,qrbox:250},
(decoded)=>{
reader.stop();
let cleanId=decoded;
if(decoded.includes('?id=')){cleanId=decoded.split('?id=')[1].split('&')[0];}
document.getElementById('certId').value=cleanId.trim().toUpperCase();
verify();
},
(err)=>{}).catch(err=>alert('Camera error: Allow camera permission'));
}
</script>
</body>
</html>
