<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function verifyCert(){
  const id=document.getElementById('certInput').value.trim();
  const resDiv=document.getElementById('result');
  if(!id){resDiv.style.display='block';resDiv.className='error';resDiv.innerHTML='❌ Enter Certificate ID';return;}
  resDiv.style.display='block';resDiv.className='success';resDiv.innerHTML='⏳ Checking Anti-Fake Database for '+id+'...';
  db.collection("certificates").doc(id).get().then(doc=>{
    if(doc.exists){
      const d=doc.data();
      resDiv.className='success';
      resDiv.innerHTML=`
        <h3 style="text-align:center;color:#0a4d2e">✅ VERIFIED AUTHENTIC - NOT FAKE</h3>
        <p style="text-align:center;color:green"><b>100% ORIGINAL!</b></p>
        <div style="text-align:left;line-height:2">
        <b>Full Name:</b> ${d.fullName||d.name||d.studentName||'N/A'}<br>
        <b>Certificate No:</b> ${d.certificateNumber||d.certNo||d.certNumber||id}<br>
        <b>Registration No:</b> ${d.registrationNumber||d.regNo||id}<br>
        <b>Institution:</b> ${d.institution||d.schoolName||'N/A'}<br>
        <b>Course:</b> ${d.course||'N/A'}<br>
        <b>Address:</b> ${d.fullAddress||d.address||'N/A'}<br>
        <b>Gender:</b> ${d.gender||'N/A'}<br>
        <b>DOB:</b> ${d.dob||'N/A'}<br>
        <b>Issue Date:</b> ${d.issueDate||'N/A'}<br>
        <b>Grade:</b> ${d.grade||'N/A'}<br>
        <b>Duration:</b> ${d.duration||'N/A'}<br>
        <b>Status:</b> <span style="color:green;font-weight:bold">${d.status||'Authentic'}</span><br>
        <br><small>QR Verified: https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify.html?id=${id}</small>
        </div>`;
    }else{resDiv.className='error';resDiv.innerHTML='❌ FAKE DETECTED - Certificate '+id+' NOT FOUND in Official Database<br>This certificate is FAKE. Report to +2349132851465';}
  }).catch(e=>{resDiv.className='error';resDiv.innerHTML='❌ Error: '+e.message;});
}
window.onload=()=>{
  const p=new URLSearchParams(window.location.search);
  const c=p.get('cert')||p.get('id');if(c){document.getElementById('certInput').value=c;verifyCert();}
}
           </script>
