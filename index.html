<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnaud Afrochaine Verification - Verify Certificate</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;padding:20px}
.container{max-width:600px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);text-align:center}
h1{color:#0b4d2e}
input{width:90%;padding:15px;border:2px solid #ddd;border-radius:10px;font-size:16px;margin:15px 0}
button{padding:14px 25px;background:#0b7a3e;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px}
.result{margin-top:20px;padding:20px;border-radius:10px;display:none;text-align:left}
.valid{background:#e6f7e6;border:2px solid #0b7a3e}
.invalid{background:#ffe6e6;border:2px solid #c62828}
</style>
</head>
<body>
<div class="container">
<h1>🔐 Arnaud Afrochaine Verification Ltd</h1>
<p>Enter Certificate ID to Verify</p>
<input id="certId" placeholder="e.g. MM1234">
<br>
<button onclick="verifyCert()">✅ VERIFY NOW</button>
<div id="result" class="result"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function verifyCert(){
 let id = document.getElementById('certId').value.trim();
 if(!id){alert('Enter ID');return;}
 let resDiv = document.getElementById('result');
 resDiv.style.display='block';
 resDiv.innerHTML='⏳ Verifying...';
 try{
  let doc = await db.collection('certificates').doc(id).get();
  if(doc.exists){
   let d = doc.data();
   resDiv.className='result valid';
   resDiv.innerHTML = `<h3>✅ VALID CERTIFICATE</h3><p><b>ID:</b> ${id}</p><p><b>Name:</b> ${d.fullName}</p><p><b>Course:</b> ${d.course}</p><p><b>Institution:</b> ${d.institution}</p><p><b>Type:</b> ${d.certificateType}</p><p><b>Issue Date:</b> ${d.issueDate}</p><p><b>Status:</b> ${d.status}</p>`;
  }else{
   resDiv.className='result invalid';
   resDiv.innerHTML=`<h3>❌ INVALID CERTIFICATE</h3><p>Certificate ID <b>${id}</b> not found in database.</p>`;
  }
 }catch(e){
  resDiv.className='result invalid';
  resDiv.innerHTML='Error: '+e.message;
 }
}

// Auto verify from QR link ?id=MM1234
window.onload = function(){
  const urlParams = new URLSearchParams(window.location.search);
  const idFromUrl = urlParams.get('id');
  if(idFromUrl){
    document.getElementById('certId').value = idFromUrl;
    verifyCert();
  }
}
</script>
</body>
</html>
