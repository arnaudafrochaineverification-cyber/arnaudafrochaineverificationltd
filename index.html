<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arnaud Afrochaine Verification</title>
<style>body{font-family:Arial;background:#0a192f;color:white;padding:15px;margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center}.box{max-width:450px;width:100%;background:white;color:#333;padding:25px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}h2{text-align:center;color:#0a192f}input{width:100%;padding:14px;margin:10px 0;border-radius:8px;border:2px solid #ddd;box-sizing:border-box;font-size:16px}button{width:100%;padding:14px;background:#0a192f;color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px}.valid{background:#d4edda;color:#155724;padding:15px;border-radius:8px;margin-top:15px;text-align:center;font-weight:bold}.invalid{background:#f8d7da;color:#721c24;padding:15px;border-radius:8px;margin-top:15px;text-align:center;font-weight:bold}</style>
</head><body>
<div class="box">
<h2>🎓 ARNAUD AFROCHAINE<br>Certificate Verification</h2>
<p style="text-align:center;font-size:13px;color:#666">Enter Certificate ID to verify</p>
<input id="certId" placeholder="e.g GML-2024-001">
<button onclick="verify()">VERIFY CERTIFICATE</button>
<div id="result"></div>
<p style="text-align:center;margin-top:20px;font-size:11px;color:#999">© 2024 Arnaud Afrochaine Verification Ltd</p>
</div>
<script>
// --- YOUR CERTIFICATES DATABASE ---
// Add all your valid IDs here
const VALID_CERTS = {
"GML-2024-001": {school:"Grace Model School", student:"John Doe", year:"2024"},
"GML-2024-002": {school:"Grace Model School", student:"Mary James", year:"2024"},
"DEMO-001": {school:"Demo School", student:"Test Student", year:"2024"}
};

function verify(){
let id = document.getElementById('certId').value.trim().toUpperCase();
if(!id){document.getElementById('result').innerHTML='<div class="invalid">Please enter Certificate ID</div>';return;}
// Check 1: from hard-coded list
let found = VALID_CERTS[id];
// Check 2: from your admin (same phone)
let saved = JSON.parse(localStorage.getItem('arnaud_certs')||'{}');
if(saved[id]) found = saved[id];
if(found){
document.getElementById('result').innerHTML = `<div class="valid">✅ VALID CERTIFICATE<br><br><b>ID:</b> ${id}<br><b>School:</b> ${found.school}<br><b>Name:</b> ${found.name||found.student}<br><br>✔️ Verified by Arnaud Afrochaine</div>`;
}else{
document.getElementById('result').innerHTML = `<div class="invalid">❌ INVALID CERTIFICATE<br><br>ID <b>${id}</b> not found in our database.<br><br>Please contact school.</div>`;
}
}
</script></body></html>
