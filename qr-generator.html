<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR Generator - Arnaud</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');body{font-family:Poppins,sans-serif;text-align:center;background:#e8f5e9;padding:15px;margin:0}.box{background:white;max-width:420px;margin:20px auto;padding:25px;border-radius:20px;box-shadow:0 12px 40px rgba(10,92,44,0.15)}input{width:90%;padding:14px;margin:12px 0;border:2px solid #0a5c2c;border-radius:12px;font-size:15px;text-transform:uppercase;text-align:center;font-weight:600}button{width:94%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin:6px 0}.gen{background:#0a5c2c;color:white}.down{background:#d4af37;color:#0a3d1f}#qrcode{margin:20px auto;display:flex;justify-content:center;padding:15px;border:2px dashed #0a5c2c;border-radius:12px;min-height:80px;background:white}#link{font-size:11px;color:#0a5c2c;word-break:break-all;font-weight:600;margin-top:10px}</style></head><body><div class="box"><img src="./IMG-20260917-WA1432.jpg" style="width:90px;height:90px;object-fit:contain;border-radius:50%"><h2 style="color:#0a5c2c;margin:10px 0">QR Generator</h2><p style="font-size:12px;color:#666">Type Certificate ID - QR will auto-open VALID page</p><input id="cid" placeholder="AA-2025-001"><button class="gen" onclick="gen()">⚡ GENERATE VALID QR</button><div id="qrcode"></div><p id="link"></p><p id="idtext" style="color:#0a5c2c;font-weight:700"></p><button class="down" onclick="dl()">📥 DOWNLOAD QR</button></div><script>const base="https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/?id=";function gen(){let id=document.getElementById('cid').value.trim().toUpperCase().replace(/\s+/g,'-');if(!id)return alert('Enter ID like AA-2025-001');let url=base+id;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:url,width:200,height:200,colorDark:"#0a5c2c",correctLevel:QRCode.CorrectLevel.H});document.getElementById('link').innerText=url;document.getElementById('idtext').innerText="ID: "+id;}function dl(){let c=document.querySelector('#qrcode canvas');if(!c)return alert('Generate first');let id=document.getElementById('cid').value.trim().toUpperCase()||'QR';let a=document.createElement('a');a.download='QR-VALID-'+id+'.png';a.href=c.toDataURL();a.click();}</script></body></html>
