<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEO Dashboard - Arnaud</title><style>body{font-family:Arial;margin:0;background:#0a192f;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}.card{max-width:500px;width:100%;background:white;color:#222;padding:25px;border-radius:15px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#0a192f;color:white;font-weight:bold;border:none}#dash{display:none}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.box2{background:#f0f4ff;padding:15px;border-radius:10px;text-align:center}.big{font-size:22px;font-weight:bold;color:#0a192f}</style></head><body>
<div class="card" id="login"><h2 style="text-align:center;color:#0a192f">👑 CEO PRIVATE</h2><p style="text-align:center;color:red;font-size:12px">CEO Access Only - Arnaud Afrochaine</p><input type="password" id="pwd" placeholder="CEO Password"><button onclick="login()">UNLOCK CEO DASHBOARD</button><p id="err" style="color:red;text-align:center"></p></div>
<div class="card" id="dash"><h2>👑 Arnaud - CEO Dashboard</h2><p>Welcome Boss!</p><div class="stat"><div class="box2"><div class="big" id="totalCert">0</div><div>Certificates</div></div><div class="box2"><div class="big" id="totalSchool">0</div><div>Schools</div></div><div class="box2"><div class="big">₦0</div><div>Revenue</div></div><div class="box2"><div class="big">100%</div><div>System OK</div></div></div><h3>Quick Actions</h3><button onclick="location.href='admin.html'" style="background:green">Go to Admin Panel</button><button onclick="location.href='./'" style="background:#666">View Public Site</button><button onclick="logout()" style="background:#333;margin-top:15px">Lock CEO Panel</button><p style="font-size:11px;color:#888;margin-top:20px;text-align:center">Arnaud Afrochaine Verification LTD<br>CEO: Arnaud - Lagos, Nigeria</p></div>
<script>
const CEO_PASS="ArnaudCEO2024@2000";
function login(){if(document.getElementById('pwd').value===CEO_PASS){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';loadStats();}else{document.getElementById('err').innerText='❌ Wrong CEO Code!';}}
function loadStats(){let all=JSON.parse(localStorage.getItem('arnaud_certs')||'{}');document.getElementById('totalCert').innerText=Object.keys(all).length;let schools=new Set();for(let k in all)if(all[k].school)schools.add(all[k].school);document.getElementById('totalSchool').innerText=schools.size;}
function logout(){document.getElementById('dash').style.display='none';document.getElementById('login').style.display='block';document.getElementById('pwd').value='';}
document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter')login();});
</script></body></html>
