<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seal Document - TrustSeal</title><style>body{font-family:Arial;background:#f6fff6;margin:0;padding:10px}.box{background:white;max-width:560px;margin:20px auto;padding:20px;border-radius:16px;box-shadow:0 10px 30px #0002;border:1px solid #C9A227}h2{color:#0a4d2a;text-align:center;font-size:14px}input,select{width:100%;padding:12px;border:2px solid #a5d6a7;border-radius:10px;margin-bottom:10px;font-size:12px}button{width:100%;padding:14px;background:#0a4d2a;color:white;border:none;border-radius:10px;font-weight:800;cursor:pointer}</style>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",authDomain:"arnaudafrochaineverification.firebaseapp.com",projectId:"arnaudafrochaineverification",storageBucket:"arnaudafrochaineverification.firebasestorage.app",messagingSenderId:"268502946630",appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
function genHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h;}return '0x'+Math.abs(h).toString(16).toUpperCase()+'-'+Date.now().toString(16).toUpperCase()+'-ARNAUD';}
window.sealDoc=async function(){
const docTitle=document.getElementById('docTitle').value.trim();const comp=document.getElementById('comp').value.trim();const dir=document.getElementById('dir').value.trim();const fileUrl=document.getElementById('fileUrl').value.trim();
if(!docTitle||!comp||!dir){alert('Fill all');return}
const btn=document.getElementById('btn');btn.innerText='⏳ SEALING...';
const q=query(collection(db,"directors"),where("directorName","==",dir));const snap=await getDocs(q);
let masterSig='';let masterVideo='';if(!snap.empty){masterSig=snap.docs[0].data().signatureUrl;masterVideo=snap.docs[0].data().videoUrl;}
const ref='TS-DOC-'+Math.floor(1000+Math.random()*9000)+'-'+Date.now().toString().slice(-4);
const hash=genHash(ref+docTitle+comp+dir+Date.now());
await addDoc(collection(db,"certificates"),{ref:ref,fullName:dir,companyName:comp,certificateType:docTitle,docType:docTitle,school:comp,issuer:comp,certificateNumber:ref,certificateImageUrl:fileUrl,signatureUrl:masterSig,videoUrl:masterVideo,signatureScore:'99.4%',blockchainHash:hash,status:'VALID - TrustSeal Sealed',location:'12 Idiroko Road, Sango Ota - GPS Verified',timestamp:new Date().toLocaleString(),cacType:'CAC Nigeria / Global Trust',ownerWallet:"0x64478336d9018927C8E45AcC35e9e24c969EfAE2",createdAt:serverTimestamp()});
alert('✅ DOCUMENT SEALED! Ref: '+ref+' Hash: '+hash+' \nShare verify link: https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/?id='+ref);
btn.innerText='✅ SEAL DOCUMENT';
}
</script></head><body><div class="box"><h2>🔒 SEAL DOCUMENT - TrustSeal QR + HASH</h2>
<input id="docTitle" placeholder="Document Title e.g. Board Resolution, Invoice, Letter">
<input id="comp" placeholder="Company Name e.g. ADEBAYO TRUST LTD (RC 1234567)">
<input id="dir" placeholder="Director Name (must match Master saved)">
<input id="fileUrl" placeholder="PDF/Image URL (Upload doc to drive, paste link)">
<button id="btn" onclick="sealDoc()">🔗 SEAL DOCUMENT - GENERATE TS-DOC-XXXX + QR</button>
<p style="font-size:10px;color:#0a4d2a;margin-top:10px;text-align:center">After seal, doc cannot be edited. If edited, hash go fail for verification. WhatsApp: 09132851465</p>
<a href="index.html" style="font-size:11px;display:block;text-align:center;color:#0a4d2a;font-weight:800">← Verify Sealed Doc</a></div></body></html>
