<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Certificate - Arnaud Afrochaine</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function load(){
  const urlParams = new URLSearchParams(window.location.search);
  let ref = urlParams.get('ref');
  if(!ref){ 
    const path = window.location.pathname;
    const parts = path.split('/');
    ref = parts[parts.length-1];
    if(ref.includes('.html')) ref = urlParams.get('ref');
  }
  const id = document.getElementById('refInput').value || ref;
  if(!id){ document.getElementById('result').innerHTML = "<p style='color:red;text-align:center'>Enter Ref Number</p>"; return; }
  document.getElementById('result').innerHTML = "Checking cloud... ⏳";
  try{
    const snap = await getDoc(doc(db, "certificates", id.trim()));
    if(!snap.exists()){
      document.getElementById('result').innerHTML = `<div style="background:#fee2e2;padding:14px;border-radius:10px;text-align:center;color:#991b1b;font-weight:800">❌ RECORD NOT FOUND<br><span style="font-size:12px;font-weight:400">${id}</span></div>`;
      return;
    }
    const d = snap.data();
    document.getElementById('result').innerHTML = `
      <div style="background:white;border:3px solid #C9A227;border-radius:14px;padding:16px">
        <div style="text-align:center;background:#0a4d2a;color:white;padding:10px;border-radius:8px;font-weight:900;margin-bottom:12px">✅ VERIFIED RECORD FOUND</div>
        <div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px"><small style="color:#14532d;font-weight:800">👤 CLIENT NAME</small><br><b>${d.name||d.fullName||''}</b></div>
        <div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px"><small style="color:#14532d;font-weight:800">📄 DOCUMENT TYPE - WETIN YOU DEY VERIFY?</small><br>${d.certificateType||d.course||''}</div>
        <div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px"><small style="color:#14532d;font-weight:800">📜 CERTIFICATE NUMBER - NUMBER WEY DEY THE ORIGINAL CERT</small><br>${d.certificateNumber||''}</div>
        <div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px"><small style="color:#14532d;font-weight:800">🎓 SCHOOL / ISSUER - WHERE THE CERT FROM? (UNILAG, WAEC)</small><br>${d.school||d.institution||''}</div>
        <div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px"><small style="color:#14532d;font-weight:800">📅 DATE VERIFIED - WHEN YOU VERIFY AM?</small><br>${d.issueDate||''}</div>
        <div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px"><small style="color:#14532d;font-weight:800">🔍 SOURCE OF VERIFICATION - HOW YOU TAKE VERIFY AM?</small><br>${d.source||''}</div>
        <div style="background:#ecfdf5;padding:12px;border-radius:8px;border-left:4px solid #0a4d2a"><small style="color:#14532d;font-weight:800">✅ STATUS - RESULT</small><br><b style="color:#0a4d2a">${d.status||''}</b><br><small style="font-size:9px;color:#64748b">(This report is based on official response from institution. See proof on file)</small></div>
        <div style="text-align:center;margin-top:14px;font-size:10px;color:#64748b">Ref: ${d.ref||id} | Verified by Arnaud Afrochaine Verification Ltd</div>
      </div>
    `;
  }catch(e){
    document.getElementById('result').innerHTML = "<p style='color:red'>Error: "+e.message+"</p>";
  }
}
window.load = load;
window.onload = ()=>{ const p=new URLSearchParams(location.search).get('ref'); if(p){ document.getElementById('refInput').value=p; load(); } };
</script>
<style>
body{font-family:Arial;background:#0f172a;padding:12px;margin:0}
.box{max-width:520px;margin:20px auto}
.top{background:white;padding:14px;border-radius:12px;text-align:center;margin-bottom:12px}
input{width:70%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:10px 14px;background:#0a4d2a;color:white;border:none;border-radius:8px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<div class="top"><h3 style="margin:0;color:#0a4d2a">ARNAUD AFROCHAINE VERIFICATION</h3><small>Certificate Verification Portal</small><div style="margin-top:10px"><input id="refInput" placeholder="Enter Ref e.g AAC/2026/112082"><button onclick="load()">Verify</button></div></div>
<div id="result"></div>
</div>
</body>
</html>
