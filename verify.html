<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Certificate - Arnaud AfroChaine</title>
<style>
body{font-family:Arial;text-align:center;padding:40px;background:#f5f5f5}
.box{background:white;padding:30px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
input{width:90%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}
button{width:95%;padding:15px;background:#000;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold}
#result{margin-top:20px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="box">
<h2>ARNAUD AFROCHAINE</h2>
<h3>Certificate Verification</h3>
<input type="text" id="certId" placeholder="Enter Certificate ID e.g AAC/2026/005">
<button onclick="verify()">VERIFY</button>
<div id="result"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function verify(){
  const id = document.getElementById('certId').value.trim();
  const res = document.getElementById('result');
  if(!id){ res.innerHTML="❌ Enter ID"; return; }
  res.innerHTML="⏳ Checking...";
  try{
    const doc = await db.collection("certificates").doc(id).get();
    if(doc.exists){
      const data = doc.data();
      res.innerHTML = `✅ VALID CERTIFICATE<br><br>Name: <b>${data.name}</b><br>Course: ${data.course}<br>ID: ${id}`;
      res.style.color="green";
    }else{
      res.innerHTML = `❌ INVALID - Certificate ${id} not found`;
      res.style.color="red";
    }
  }catch(e){
    res.innerHTML="Error: "+e.message;
  }
}
</script>
</body>
</html>
