<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate - Arnaud Afrochaine Verification Ltd</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4f8;padding:20px}
.container{max-width:600px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{text-align:center;color:#1a3a5f}
input{width:100%;padding:14px;margin:15px 0;border:2px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;background:#1a3a5f;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:bold}
button:hover{background:#0f2540}
#result{margin-top:25px;padding:20px;border-radius:8px;display:none}
.valid{background:#e6f7e6;border:1px solid #4CAF50;color:#2e7d32}
.invalid{background:#fdecea;border:1px solid #f44336;color:#b71c1c}
.field{margin:8px 0;padding:8px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.field strong{color:#333} .field span{color:#555;text-align:right;max-width:60%}
.header-logo{text-align:center;margin-bottom:10px;font-weight:bold;color:#1a3a5f;font-size:18px}
</style>
</head>
<body>
<div class="container">
<div class="header-logo">ARNAUD AFROCHAINE VERIFICATION LTD</div>
<h2>🔍 Verify Certificate</h2>
<p style="text-align:center;color:#666">Enter Certificate ID to verify authenticity</p>
<input type="text" id="certId" placeholder="e.g. AAC/2026/005 or BB1234">
<button onclick="verifyCert()">VERIFY NOW</button>
<div id="result"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function verifyCert(){
  const id = document.getElementById('certId').value.trim();
  const resDiv = document.getElementById('result');
  if(!id){ alert('Please enter Certificate ID'); return; }
  resDiv.style.display='block';
  resDiv.innerHTML='⏳ Checking...';
  resDiv.className='';
  try{
    const doc = await db.collection('certificates').doc(id).get();
    if(doc.exists){
      const d = doc.data();
      resDiv.className='valid';
      resDiv.innerHTML = `
        <h3 style="text-align:center">✅ VALID CERTIFICATE</h3>
        <div class="field"><strong>Certificate ID:</strong><span>${id}</span></div>
        <div class="field"><strong>Full Name:</strong><span>${d.fullName||d.name||'N/A'}</span></div>
        <div class="field"><strong>Course/Program:</strong><span>${d.course||d.program||'N/A'}</span></div>
        <div class="field"><strong>Institution:</strong><span>${d.institution||'Arnaud Afrochaine Verification Ltd'}</span></div>
        <div class="field"><strong>Certificate Type:</strong><span>${d.certificateType||d.type||'N/A'}</span></div>
        <div class="field"><strong>Issue Date:</strong><span>${d.issueDate||d.date||'N/A'}</span></div>
        <div class="field"><strong>Expiry Date:</strong><span>${d.expiryDate||'N/A'}</span></div>
        <div class="field"><strong>Grade/Score:</strong><span>${d.grade||d.score||'N/A'}</span></div>
        <div class="field"><strong>Duration:</strong><span>${d.duration||'N/A'}</span></div>
        <div class="field"><strong>Verification Status:</strong><span>${d.status||'Verified'}</span></div>
        <div class="field"><strong>Issued By:</strong><span>${d.issuedBy||'Registrar'}</span></div>
        <div class="field"><strong>Additional Note:</strong><span>${d.note||d.description||'N/A'}</span></div>
        <p style="text-align:center;margin-top:15px;font-size:12px;color:#666">Verified via Arnaud Afrochaine Verification System</p>
      `;
    } else {
      resDiv.className='invalid';
      resDiv.innerHTML=`<h3>❌ NOT FOUND</h3><p>Certificate ID <strong>${id}</strong> does not exist in our database.</p>`;
    }
  }catch(e){
    resDiv.className='invalid';
    resDiv.innerHTML=`<h3>⚠️ Error</h3><p>${e.message}</p>`;
  }
}
</script>
</body>
</html>
