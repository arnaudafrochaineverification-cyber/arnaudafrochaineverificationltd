<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arnaud Verification - Fixed</title>
<style>body{background:#eef2f7;margin:0;font-family:Arial;display:flex;justify-content:center;padding:16px}.card{max-width:500px;width:100%;background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}.top{height:6px;background:#16a34a}.pad{padding:20px}h2{text-align:center;margin:0;font-size:20px}.sub{text-align:center;color:#64748b;font-size:11px;margin:6px 0 14px}.ok{background:#dcfce7;color:#14532d;padding:12px;border-radius:10px;text-align:center;font-weight:bold}.bad{background:#fee2e2;color:#7f1d1d;padding:12px;border-radius:10px;text-align:center;font-weight:bold}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px}.lbl{color:#64748b}.val{font-weight:700;text-align:right;max-width:62%;word-break:break-word}</style>
</head><body>
<div class="card"><div class="top"></div><div class="pad">
<h2>Arnaud Afro Chaine Verification Ltd</h2>
<div class="sub">Official Certificate Verification System - Apapa Lagos</div>
<div id="out">Loading...</div>
</div></div>
<script>
function getParam(){let p=new URLSearchParams(location.search);return p.get('d')||p.get('data');}
function safeDecode(b64){
 try{return JSON.parse(atob(b64));}catch(e){
  try{return JSON.parse(decodeURIComponent(escape(atob(b64))));}catch(e2){return null;}
 }
}
let d=getParam();let out=document.getElementById('out');
if(!d){out.innerHTML='<div class="bad">⚠️ No QR Code Scanned</div><p style="font-size:12px;color:#64748b;text-align:center;line-height:1.5">This page only works when you scan the QR code on a certificate.<br><br>1. Open your phone camera<br>2. Scan the QR on the certificate<br>3. Click the link that appears<br><br>If you are the admin, go to admin.html, generate QR, then click Open Verify to test.</p>';}
else{
 let data=safeDecode(d);
 if(!data){out.innerHTML='<div class="bad">Invalid Link - Data corrupted</div><p style="font-size:11px;color:#64748b;text-align:center">Try scanning again. If problem continues, regenerate QR from admin.</p>';}
 else{
  let valid=(data.status||'VALID')==='VALID';
  out.innerHTML=`<div class="${valid?'ok':'bad'}">${valid?'✅ CERTIFICATE VALID - AUTHENTIC':'❌ INVALID'}</div>
  <div class="row"><span class="lbl">1 Full Name</span><span class="val">${data.name||''}</span></div>
  <div class="row"><span class="lbl">2 Cert No</span><span class="val">${data.code||''}</span></div>
  <div class="row"><span class="lbl">3 Program</span><span class="val">${data.program||''}</span></div>
  <div class="row"><span class="lbl">4 DOB</span><span class="val">${data.dob||''}</span></div>
  <div class="row"><span class="lbl">5 ID No</span><span class="val">${data.idNo||''}</span></div>
  <div class="row"><span class="lbl">6 Issue Date</span><span class="val">${data.issue||''}</span></div>
  <div class="row"><span class="lbl">7 Expiry</span><span class="val">${data.expiry||''}</span></div>
  <div class="row"><span class="lbl">8 Center</span><span class="val">${data.center||''}</span></div>
  <div class="row"><span class="lbl">9 Grade</span><span class="val">${data.grade||''}</span></div>
  <div class="row"><span class="lbl">10 Status</span><span class="val" style="color:${valid?'green':'red'}">${data.status||'VALID'}</span></div>
  <div class="row"><span class="lbl">11 Issuer</span><span class="val">${data.issuer||''}</span></div>
  <div class="row"><span class="lbl">12 V-Code</span><span class="val">${data.vcode||''}</span></div>
  <p style="font-size:10px;color:#94a3b8;text-align:center;margin-top:14px">Verified by Arnaud Afro Chaine Verification Ltd<br>© 2026 - Apapa, Lagos, Nigeria</p>`;
 }
}
</script></body></html>
