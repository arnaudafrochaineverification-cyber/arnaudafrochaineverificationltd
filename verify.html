<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify - With Photo</title><style>body{background:#eef2f7;font-family:Arial;display:flex;justify-content:center;padding:12px} .card{background:#fff;padding:22px;border-radius:16px;max-width:540px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center} .valid{color:#16a34a;font-weight:900;font-size:22px} .photo{width:120px;height:120px;border-radius:12px;object-fit:cover;border:3px solid #16a34a;margin:10px auto;display:block} .row{margin:10px 0;border-bottom:1px solid #f1f5f9;padding-bottom:8px;text-align:left} .label{font-size:10px;color:#64748b;text-transform:uppercase} .value{font-size:14px;font-weight:bold;color:#0f172a} .badge{background:#16a34a;color:#fff;padding:4px 12px;border-radius:20px;font-size:11px}</style></head><body><div class="card"><h2 style="margin:0">Arnaud Afro Chaine Verification Ltd</h2><p style="color:#64748b;font-size:11px">UK Standard 12-Field Verification</p><div id="out">Checking...</div></div><script>function g(n){return new URLSearchParams(location.search).get(n)}let d=g('d'),o=document.getElementById('out');if(!d){o.innerHTML='❌ Invalid QR'}else{try{let j=JSON.parse(atob(d));let ph=j.photo||j.passport||j.image||'';o.innerHTML=`<p class="valid">✅ CERTIFICATE VALIDATED</p><p><span class="badge">${j.status||'VALID'}</span> <span class="badge" style="background:#0ea5e9">${j.grade||'Pass'}</span></p>${ph?`<img class="photo" src="${ph}" alt="Passport">`:''}<div class="row"><div class="label">1. FULL NAME</div><div class="value">${j.name||''}</div></div><div class="row"><div class="label">2. CERTIFICATE NUMBER</div><div class="value">${j.code||''}</div></div><div class="row"><div class="label">3. TITLE / PROGRAM</div><div class="value">${j.program||j.course||''}</div></div><div class="row"><div class="label">4. DOB / ID</div><div class="value">${j.dob||'-'} - ID: ${j.idNo||''}</div></div><div class="row"><div class="label">5 & 6. ISSUE - EXPIRY</div><div class="value">${j.issue||''} to ${j.expiry||''}</div></div><div class="row"><div class="label">7. TRAINING CENTER</div><div class="value">${j.center||''}</div></div><div class="row"><div class="label">8. ISSUER</div><div class="value">Arnaud Afro Chaine Verification Ltd<br><small>arnaudafrochaineverificationltd.com</small></div></div><div class="row"><div class="label">9. AUTHORIZATION</div><div class="value">Director - Digitally Signed & Verified ✅</div></div>`}catch(e){o.innerHTML='❌ Failed: '+e}}</script></body></html>
