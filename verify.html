<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Certificate - Arnaud Afro Chaine</title>
<style>body{font-family:Arial;background:#f1f5f9;padding:15px}.card{max-width:550px;margin:40px auto;background:#fff;border-radius:16px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.1);border-top:6px solid #16a34a}.ok{background:#16a34a;color:#fff;padding:12px;border-radius:8px;text-align:center;font-weight:bold;font-size:16px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.row b{color:#334155;width:40%}.row span{width:60%;text-align:right;word-break:break-all}h2{text-align:center;color:#0f172a;line-height:1.2}</style>
</head><body>
<div class="card"><h2>Arnaud Afro Chaine<br>Verification Ltd</h2><div id="out">Loading...</div></div>
<script>
let d=new URLSearchParams(location.search).get('d');
if(!d){document.getElementById('out').innerHTML='<p style="color:red;text-align:center">Invalid Link</p>';}
else{
 try{
  let j=JSON.parse(atob(d));
  document.getElementById('out').innerHTML=`
  <div class="ok">✅ CERTIFICATE VALIDATED - ${j.status||'VALID'}</div>
  <div style="margin-top:15px">
  <div class="row"><b>1. Full Name:</b><span>${j.name||''}</span></div>
  <div class="row"><b>2. Cert No:</b><span>${j.code||''}</span></div>
  <div class="row"><b>3. Program:</b><span>${j.program||''}</span></div>
  <div class="row"><b>4. DOB:</b><span>${j.dob||''}</span></div>
  <div class="row"><b>5. ID Number:</b><span>${j.idNo||''}</span></div>
  <div class="row"><b>6. Issue Date:</b><span>${j.issue||''}</span></div>
  <div class="row"><b>7. Expiry Date:</b><span>${j.expiry||''}</span></div>
  <div class="row"><b>8. Center:</b><span>${j.center||''}</span></div>
  <div class="row"><b>9. Grade:</b><span>${j.grade||''}</span></div>
  <div class="row"><b>10. Status:</b><span>${j.status||''}</span></div>
  <div class="row"><b>11. Issuer:</b><span>${j.issuer||''}</span></div>
  <div class="row"><b>12. V-Code:</b><span>${j.vcode||j.code||''}</span></div>
  </div><p style="text-align:center;font-size:10px;color:#94a3b8;margin-top:20px">Verified via arnaudafrochaineverificationltd.github.io<br>Official Document</p>`;
 }catch(e){document.getElementById('out').innerHTML='<p style="color:red;text-align:center">❌ Invalid QR Code</p>';}
}
</script></body></html>
