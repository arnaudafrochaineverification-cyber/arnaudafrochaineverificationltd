.corner.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.corner.tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:14px}
.corner.bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:14px}
.corner.br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.head{ text-align:center; border-bottom:2px solid var(--gold); padding-bottom:12px; margin-bottom:12px}
.head h1{font-family:'Playfair Display';font-size:20px; color:var(--dark); font-weight:900; letter-spacing:.5px}
.head.sub{font-size:9px; letter-spacing:2px; color:var(--green); font-weight:700; margin-top:3px}

.box.full{grid-column:1 / -1}
.box label{font-size:8px; color:#64748b; font-weight:700; letter-spacing:1px; text-transform:uppercase; display:block}
.box.val{font-size:13px; font-weight:700; color:var(--dark); margin-top:2px; word-break:break-all; font-family:'Playfair Display'}
.box.mono{font-family:monospace; font-size:11px}
.sealRow{display:flex; justify-content:space-between; align-items:center; margin-top:16px; border-top:1px dashed var(--gold); padding-top:12px; flex-wrap:wrap; gap:10px}
.seal{width:72px;height:72px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#fff9d6,#f6e7a0);color:var(--dark);font-size:8px;font-weight:900;text-align:center}
.ndpa{font-size:9px;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin-top:12px;text-align:center}

@media(max-width:600px){.details{grid-template-columns:1fr}.paper{padding:10px}.paperInner{padding:12px}}

</head><body>
<div class="topBar">
<div class="brand"><img src="logo.jpg" onerror="this.style.display='none'"><div><b>ARNAUD AFROCHAINE<br>VERIFICATION LTD</b><div style="font-size:8px;color:#ccc">African Roots, Global Vision</div></div></div>
<div style="font-size:10px;color:var(--gold);font-weight:700">500B ARNAUD<br><span style="color:white;font-size:8px">BLOCKCHAIN VERIFIED</span></div>
</div>

<div class="container">
<div id="loading" class="loading">🔍 Verifying <b id="refText">...</b> on Blockchain...<br><small style="color:#64748b">Wallet: 0x6447...fAE2 | 500B ARNAUD</small></div>
<div id="result" style="display:none"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getRefFromUrl(){
  const p = new URLSearchParams(window.location.search);
  return (p.get('ref') || p.get('reference') || p.get('id') || '').trim();
}

async function findCert(ref){
  if(!ref) return null;
  const safeId = ref.replace(/\//g,"-").replace(/[^a-zA-Z0-9-_]/g,"_");
  // Try direct doc id
  try{ const d = await getDoc(doc(db,"certificates",safeId)); if(d.exists()) return d.data(); }catch{}
  try{ const d = await getDoc(doc(db,"certificates",ref)); if(d.exists()) return d.data(); }catch{}
  // Try query on field
  try{
    const q = query(collection(db,"certificates"), where("ref","==",ref));
    const s = await getDocs(q); if(!s.empty) return s.docs[0].data();
  }catch{}
  try{
    const q = query(collection(db,"certificates"), where("reference","==",ref));
    const s = await getDocs(q); if(!s.empty) return s.docs[0].data();
  }catch{}
  return null;
}

async function run(){
  const ref = getRefFromUrl();
  document.getElementById('refText').textContent = ref || 'UNKNOWN';
  if(!ref){
    document.getElementById('loading').innerHTML = "❌ No reference provided in QR link.";
    return;
  }
  const data = await findCert(ref);
  document.getElementById('loading').style.display="none";
  const resultDiv = document.getElementById('result');
  resultDiv.style.display="block";

  if(!data){
    resultDiv.innerHTML = `
      <div class="statusCard invalid"><h2>❌ NOT FOUND</h2><p>Reference <b>${ref}</b> not in our secure database.</p><span class="badge bad">INVALID / POSSIBLE FAKE</span></div>
      <div class="paper"><div class="paperInner" style="text-align:center;padding:30px">This certificate cannot be verified. Contact ARNAUD AFROCHAINE VERIFICATION LTD.<br><br><small>Wallet: 0x6447...fAE2</small></div></div>
    `;
    return;
  }

  const isValid = (data.status||'Verified').toLowerCase() === 'verified';
  resultDiv.innerHTML = `
    <div class="statusCard ${isValid?'valid':'invalid'}">
      <h2>${isValid?'✅ VERIFIED AUTHENTIC':'⚠️ '+ (data.status||'PENDING')}</h2>
      <p>Blockchain confirmed for <b>${data.fullName||data.name||''}</b></p>
      <span class="badge ${isValid?'ok':'bad'}">${isValid?'VERIFIED • NDPA COMPLIANT • 500B ARNAUD':'STATUS: '+(data.status||'UNKNOWN')}</span>
      <div style="font-size:10px;color:#64748b;margin-top:8px">Wallet: ${data.wallet||data.walletAddress||'0x6447...fAE2'} | Hash: ${(data.hash||data.blockchainHash||'').substring(0,18)}... | On-Chain: hash only</div>
    </div>

    <div class="paper">
      <div class="paperInner">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <div class="head">
          <div class="emblem">A</div>
          <h1>ARNAUD AFROCHAINE VERIFICATION LTD</h1>
          <div class="sub">AFRICAN ROOTS • GLOBAL VISION • BLOCKCHAIN SECURED • 500B ARNAUD</div>
        </div>

        <div style="text-align:center;margin:8px 0">
          <div style="font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:700">CERTIFICATE VERIFICATION RESULT</div>
          <div style="font-family:'Playfair Display';font-size:22px;font-weight:900;color:var(--dark);margin-top:4px">${data.fullName||data.name||'---'}</div>
          <div style="font-size:11px;color:#64748b">has been verified as authentic by our blockchain system</div>
        </div>

        <div class="details">
          <div class="box"><label>Our Verification Reference (ARNAUD)</label><div class="val mono">${data.ref||data.reference||ref}</div></div>
          <div class="box"><label>School Certificate Number</label><div class="val mono">${data.certNumber||data.certificateNumber||data.schoolCertNumber||'---'}</div></div>
          <div class="box"><label>School / Entity</label><div class="val">${data.school||data.institution||'---'}</div></div>
          <div class="box"><label>Course / Category</label><div class="val">${data.course||data.certificateType||'---'}</div></div>
          <div class="box"><label>Issue Date</label><div class="val">${data.issueDate||'---'}</div></div>
          <div class="box"><label>Wallet Verification</label><div class="val mono">${data.wallet||data.walletAddress||'0x6447...fAE2'}</div></div>
          <div class="box full"><label>Blockchain Hash (SHA-256 • Hash Only - No Personal Data)</label><div class="val mono" style="font-size:10px">${data.hash||data.blockchainHash||'---'}</div></div>
          <div class="box full"><label>Note</label><div class="val" style="font-size:11px;font-weight:400">${data.note||'ARNAUD AFROCHAINE VERIFICATION LTD - NDPA 2023 Compliant'}</div></div>
        </div>

        <div class="sealRow">
          <div class="seal"><span style="font-size:14px">✔</span><span>VERIFIED</span><span style="font-size:6px">AAV</span></div>
          <div style="text-align:center"><div style="width:120px;border-top:1px solid #0a1931;margin:0 auto"></div><div style="font-size:9px;font-weight:700;margin-top:3px">DIRECTOR OF VERIFICATION</div><div style="font-size:8px;color:#64748b">ARNAUD AFROCHAINE VERIFICATION LTD</div></div>
          <div style="text-align:right;font-size:9px;color:#64748b">Date Verified<br><b style="color:#0a1931">${new Date().toLocaleDateString()}</b><br>500B ARNAUD</div>
        </div>

        <div class="ndpa">
          🔒 NDPA 2023 Compliant • Blockchain Wallet: 0x64478336d9018927C8E45AcC35e9e24c969EfAE2 • On-chain stores hash only, no personal data • African Roots, Global Vision • 500 Billion ARNAUD Token Vision • verify at: arnaudafrochaineverification.com
        </div>
      </div>
    </div>
  `;
}
run();
</script>
