<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify - 12 Field Legit</title><style>body{background:#eef2f7;font-family:Arial;display:flex;justify-content:center;padding:12px} .card{background:#fff;padding:22px;border-radius:16px;max-width:540px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.12)} .valid{color:#16a34a;font-weight:900;font-size:22px;text-align:center} .row{margin:10px 0;border-bottom:1px solid #f1f5f9;padding-bottom:8px} .label{font-size:10px;color:#64748b;text-transform:uppercase} .value{font-size:14px;font-weight:bold;color:#0f172a;word-break:break-word} .badge{background:#16a34a;color:#fff;padding:4px 12px;border-radius:20px;font-size:11px}</style></head><body><div class="card"><h2 style="text-align:center;margin:0">Arnaud Afro Chaine Verification Ltd</h2><p style="text-align:center;color:#64748b;font-size:11px">UK Standard 12-Field Verification</p><div id="out" style="text-align:center;padding:15px">Checking...</div></div><script>function g(n){return new URLSearchParams(location.search).get(n)}let d=g('d'),o=document.getElementById('out');if(!d){o.innerHTML='❌ Invalid QR - No data'}else{try{let j=JSON.parse(atob(d));o.innerHTML=`<p class="valid">✅ CERTIFICATE VALIDATED</p><p style="text-align:center"><span class="badge">${j.status||'VALID'}</span> <span class="badge" style="background:#0ea5e9">${j.grade||'Pass'}</span></p><div class="row"><div class="label">1. Full Name (Legal Name)</div><div class="value">${j.name||''}</div></div><div class="row"><div class="label">2. Certificate Number</div><div class="value">${j.code||''}</div></div><div class="row"><div class="label">3. Title / Program Name</div><div class="value">${j.program||j.course||''}</div></div><div class="row"><div class="label">4. Date of Birth / ID</div><div class="value">${j.dob||''} - ID: ${j.idNo||''}</div></div><div class="row"><div class="label">5 & 6. Date of Issue - Date of Expiry</div><div class="value">${j.issue||''} to ${j.expiry||''}</div></div><div class="row"><div class="label">7. Training Center / Location</div><div class="value">${j.center||''}</div></div><div class="row"><div class="label">8. Issuer Information</div><div class="value">${j.issuer||'Arnaud Afro Chaine Verification Ltd'}<br><small>arnaudafrochaineverificationltd.com</small></div></div><div class="row"><div class="label">9. Authorization / Signature</div><div class="value">Director - Digitally Signed & Verified ✅</div></div>`}catch(e){o.innerHTML='❌ Verification Failed: '+e}}</script></body></html>
