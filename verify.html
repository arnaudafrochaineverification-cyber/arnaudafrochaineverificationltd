<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify - Arnaud Afrochaine Verification Ltd</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadCert(){
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  document.getElementById('refId').innerText = ref || 'No Ref';
  
  if(!ref){
    document.getElementById('result').innerHTML = "<p style='color:red'>No reference number in QR link</p>";
    return;
  }

  try{
    const snap = await getDoc(doc(db, "certificates", ref));
    if(!snap.exists()){
      document.getElementById('result').innerHTML = `<div style='background:#fef2f2;padding:14px;border-radius:10px;border:1px solid #fecaca'><h3 style='color:#991b1b'>❌ Reference Not Found</h3><p>Ref <b>${ref}</b> not found in Arnaud Afrochaine database. Check number or contact support.</p></div>`;
      return;
    }
    const d = snap.data();
    document.getElementById('result').innerHTML = `
      <div style='background:white;padding:18px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);text-align:left'>
        <div style='text-align:center;border-bottom:2px solid #facc15;padding-bottom:10px;margin-bottom:12px'>
          <h2 style='margin:0;color:#0f172a'>ARNAUD AFROCHAINE VERIFICATION LTD</h2>
          <p style='font-size:11px;color:#ca8a04;font-weight:800'>OFFICIAL VERIFICATION REPORT</p>
        </div>
        <p><b>Ref:</b> ${d.ref || ref}</p>
        <p><b>Client Name:</b> ${d.name || d.fullName}</p>
        <p><b>Document Type:</b> ${d.certificateType || d.course}</p>
        <p><b>Certificate No:</b> ${d.certificateNumber || '-'}</p>
        <p><b>Institution / Issuer:</b> ${d.school}</p>
        <p><b>Date Verified:</b> ${d.issueDate || d.createdAt}</p>
        <hr>
        <p><b>Source of Verification:</b><br><span style='font-size:13px;color:#334155'>${d.source}</span></p>
        <div style='margin-top:12px;padding:10px;border-radius:8px;background:${d.status && d.status.includes('CONFIRMED ISSUANCE') ? '#f0fdf4' : '#fffbeb'};border:1px solid ${d.status && d.status.includes('CONFIRMED ISSUANCE') ? '#bbf7d0' : '#fde68a'}'>
          <b>Status:</b><br>${d.status}
        </div>
        <p style='font-size:11px;color:#64748b;margin-top:12px'><b>Evidence on file:</b> ${d.note || 'Available on request with consent'}</p>
        <p style='font-size:9px;color:#94a3b8;margin-top:16px;text-align:center'>Disclaimer: Arnaud Afrochaine Verification Ltd reports information received from institutions. We do not issue academic certificates. Original email evidence available on file with consent. For enquiries: arnaudafrochaineverification@gmail.com</p>
      </div>
    `;
  }catch(e){
    document.getElementById('result').innerHTML = `<p style='color:red'>Error loading: ${e.message}</p>`;
  }
}
window.addEventListener('DOMContentLoaded', loadCert);
</script>
<style>body{font-family:Arial;background:#f4f6f9;padding:12px;margin:0} .box{max-width:540px;margin:20px auto} h3{text-align:center}</style>
</head>
<body>
<div class="box">
<h3>🔍 Verification Portal</h3>
<p style="text-align:center;font-size:12px">Ref: <b id="refId">Loading...</b></p>
<div id="result" style="margin-top:16px"><p style="text-align:center">Checking cloud database... ⏳</p></div>
<p style="text-align:center;margin-top:20px"><a href="index.html" style="font-size:12px;color:#0f172a">← Back to Home</a></p>
</div>
</body>
</html>
