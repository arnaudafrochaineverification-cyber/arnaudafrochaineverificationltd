<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate - Arnaud Global Verification</title>
<style>
body{font-family:Arial;background:#0f172a;padding:12px;margin:0;color:#1f2937}
.box{max-width:520px;margin:20px auto}
.top,.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.top{text-align:center;border-top:4px solid #C9A227}
h3{color:#0a1931;margin:0}
.sub{font-size:11px;color:#64748b;margin-top:4px}
.search{display:flex;gap:8px;margin-top:15px}
input{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:12px 16px;background:#0a4d2a;color:white;border:none;border-radius:8px;font-weight:800;cursor:pointer}
.field{background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px}
.label{color:#14532d;font-size:11px;font-weight:800}
.status{padding:12px;background:#ecfdf5;border-left:4px solid #0a4d2a;border-radius:8px}
.error{padding:14px;color:#991b1b;background:#fee2e2;border-radius:8px;text-align:center}
footer{font-size:10px;color:#64748b;text-align:center;margin-top:15px}
.badge{display:inline-block;background:#0a1931;color:#C9A227;padding:4px 8px;border-radius:4px;font-size:10px;margin-top:6px}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function findCertificate(searchValue){
  const value = searchValue.trim();
  if(!value) return null;

  // 1. Try Doc ID but DON'T CRASH if slash dey inside
  try{
    if(!value.includes('/')){ // only try Doc ID if no slash
      const direct = await getDoc(doc(db, "certificates", value));
      if(direct.exists()) return {id: direct.id, data: direct.data()};
    }
  }catch(e){ console.log("Doc ID search skip:", e.message); }

  // 2. Search by all possible ref fields
  const fields = ["ref", "reference", "refNumber", "verificationRef"];
  for(const field of fields){
    try{
      const q = query(collection(db, "certificates"), where(field, "==", value), limit(1));
      const snap = await getDocs(q);
      if(!snap.empty) return {id: snap.docs[0].id, data: snap.docs[0].data()};
    }catch(e){ console.log(field+" search error", e.message); }
  }

  // 3. Search by certificateNumber and certificate number with space
  for(const field of ["certificateNumber", "certNumber"]){
    try{
      const q = query(collection(db, "certificates"), where(field, "==", value), limit(1));
      const snap = await getDocs(q);
      if(!snap.empty) return {id: snap.docs[0].id, data: snap.docs[0].data()};
    }catch(e){}
  }
  return null;
}

function safe(v){ const el=document.createElement("span"); el.textContent=v==null?"":String(v); return el.innerHTML; }

async function load(){
  const input = document.getElementById("refInput");
  const result = document.getElementById("result");
  const value = input.value.trim();
  if(!value){ result.innerHTML='<div class="error">Please enter Ref Number</div>'; return; }
  result.textContent="Checking global database... ⏳";
  try{
    const found = await findCertificate(value);
    if(!found){ result.innerHTML=`<div class="error"><b>❌ RECORD NOT FOUND</b><br>No record for: ${safe(value)}<br><small>Check Admin - make sure field 'ref' = ${safe(value)}</small></div>`; return; }
    const d=found.data;
    const status=String(d.status||"Verified");
    result.innerHTML=`
      <div class="card">
        <div style="text-align:center;background:#0a4d2a;color:white;padding:10px;border-radius:8px;font-weight:900">✅ VERIFIED - RECORD FOUND</div>
        <div style="text-align:center;margin:8px 0"><span class="badge">ARNAUD GLOBAL VERIFICATION - Serving Canada, USA, UK</span></div>
        <div class="field"><div class="label">FULL NAME</div><b>${safe(d.fullName||d.name)}</b></div>
        <div class="field"><div class="label">CERTIFICATE NUMBER</div>${safe(d.certificateNumber)}</div>
        <div class="field"><div class="label">CERTIFICATE TYPE / COURSE</div>${safe(d.certificateType||d.course)}</div>
        <div class="field"><div class="label">SCHOOL / ISSUER</div>${safe(d.school||d.institution)}</div>
        <div class="field"><div class="label">ISSUE DATE</div>${safe(d.issueDate)}</div>
        <div class="status"><div class="label">STATUS</div><b>${safe(status)}</b><p style="font-size:12px;margin:6px 0">This record has been verified via direct contact with issuing institution. For employer confirmation: verify@arnaudglobal.com</p></div>
        <footer>Ref: ${safe(d.ref||found.id)}<br>ARNAUD AFROCHAINE VERIFICATION LTD | Global Verification Service<br>African Roots, Global Trust</footer>
      </div>`;
  }catch(e){ result.innerHTML=`<div class="error"><b>SEARCH ERROR</b><br>${safe(e.message)}</div>`; console.error(e); }
}
window.load=load;
window.addEventListener('DOMContentLoaded',()=>{
  const input=document.getElementById("refInput");
  document.getElementById("verifyButton").addEventListener("click",load);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") load(); });
  const p=new URLSearchParams(location.search).get("ref")||new URLSearchParams(location.search).get("id");
  if(p){ input.value=p; load(); }
});
</script>
</head>
<body>
<div class="box">
  <div class="top">
    <h3>ARNAUD GLOBAL VERIFICATION</h3>
    <div class="sub">Official Verification Service of Arnaud Afrochaine Verification Ltd</div>
    <div class="sub">Lagos, NG | Cotonou, BJ | Trusted by Diaspora in Canada, USA, UK, Australia</div>
    <div class="search"><input id="refInput" placeholder="Enter Ref e.g AAC/2026/112082"><button id="verifyButton" type="button">Verify</button></div>
  </div>
  <div id="result"></div>
</div>
</body>
  </html>
