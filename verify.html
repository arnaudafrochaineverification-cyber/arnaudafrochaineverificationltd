<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verify Certificate - ARNAUD</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#e8f5e9;padding:15px} .box{background:white;max-width:500px;margin:30px auto;padding:25px;border-radius:15px;text-align:center} .auth{color:green;font-size:24px;font-weight:bold} .fake{color:red;font-size:24px;font-weight:bold} #qrBox{margin:20px auto;padding:15px;border:2px dashed #0a3d1a;border-radius:10px;background:#f9fff9} #qrcode{display:flex;justify-content:center;margin:10px 0}</style>
</head><body><div class="box">
<h2 style="color:#0a3d1a">ARNAUD AFROCHAINE VERIFICATION LTD</h2><p id="loading">Checking certificate...</p>
<div id="result" style="display:none">
<h3>Certificate Found:</h3>
<p><b>Full Name:</b> <span id="r1"></span></p><p><b>Institution:</b> <span id="r2"></span></p><p><b>Course:</b> <span id="r3"></span></p><p><b>Cert No:</b> <span id="r4"></span></p><p><b>Date:</b> <span id="r5"></span></p><p><b>Grade:</b> <span id="r6"></span></p>
<h2 id="status" class="auth"></h2>
<div id="qrBox">
<p style="font-weight:bold;color:#0a3d1a;margin:0">📱 SCAN QR CODE TO VERIFY</p>
<div id="qrcode"></div>
<p id="qrLinkText" style="font-size:11px;color:#555;word-break:break-all"></p>
</div>
<p style="font-size:12px">We VERIFY, we don't ISSUE certificates. Sango Ota, Ogun State</p>
</div><div id="notfound" style="display:none"><h2 class="fake">❌ NOT FOUND / FAKE</h2><p>This certificate number no dey for our database.</p></div>
</div><script>
const firebaseConfig = { apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs", authDomain: "arnaudafrochaineverification.firebaseapp.com", projectId: "arnaudafrochaineverification", storageBucket: "arnaudafrochaineverification.firebasestorage.app", messagingSenderId: "268502946630", appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47" };
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let params=new URLSearchParams(window.location.search);
let id=params.get('id') || params.get('cert');
if(!id){document.getElementById('loading').innerText="No certificate ID in link";} else {
 db.collection("verifications").doc(id).get().then(doc=>{
   if(doc.exists){ let d=doc.data(); r1.innerText=d.fullName; r2.innerText=d.institution; r3.innerText=d.course; r4.innerText=d.certNum; r5.innerText=d.issueDate; r6.innerText=d.grade; status.innerText="✅ "+d.status; result.style.display='block'; loading.style.display='none';
   let verifyUrl = `https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify.html?id=${id}`;
   document.getElementById('qrLinkText').innerText = verifyUrl;
   new QRCode(document.getElementById('qrcode'), {text: verifyUrl, width: 180, height: 180, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H});
   } else { notfound.style.display='block'; loading.style.display='none'; }
 });
}
</script></body></html>
