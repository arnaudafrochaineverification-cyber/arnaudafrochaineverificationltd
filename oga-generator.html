<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const OGA_PIN = "Gbenga333649";
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.checkPin = function(){
  const pin = document.getElementById('pinInput').value;
  if(pin === OGA_PIN){
    document.getElementById('pinBox').style.display="none";
    document.getElementById('formBox').style.display="block";
  } else { alert("❌ Wrong PIN Oga!"); }
}
window.autoGenID = function(){
  const year = new Date().getFullYear();
  const rand = Math.floor(100000 + Math.random()*900000);
  document.getElementById('certId').value = `AAC/${year}/${rand}`;
}
window.saveCert = async function(){
  const certId = document.getElementById('certId').value.trim();
  const fullName = document.getElementById('fullName').value.trim();
  const institution = document.getElementById('institution').value.trim();
  if(!fullName){ alert("Fill Client Name"); return; }
  if(!institution){ alert("Fill Institution"); return; }
  const verifyLink = `https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify.html?ref=${certId}`;
  const btn = document.getElementById('saveBtn');
  btn.innerText = "Saving to Cloud... ⏳"; btn.disabled = true;
  try{
    await setDoc(doc(db, "certificates", certId), {
      ref: certId,
      certificateNumber: document.getElementById('certNo').value,
      name: fullName, fullName: fullName,
      certificateType: document.getElementById('certType').value,
      school: institution,
      course: document.getElementById('certType').value,
      issueDate: document.getElementById('issueDate').value,
      source: document.getElementById('source').value,
      status: document.getElementById('status').value,
      note: document.getElementById('note').value,
      verifyLink: verifyLink,
      createdAt: new Date().toISOString()
    });
    document.getElementById('formBox').style.display="none";
    document.getElementById('successBox').style.display="block";
    document.getElementById('savedId').innerText = certId;
    document.getElementById('pName').innerText = fullName;
    document.getElementById('pSchool').innerText = institution;
    document.getElementById('pCertNo').innerText = document.getElementById('certNo').value;
    document.getElementById('pType').innerText = document.getElementById('certType').value;
    document.getElementById('pDate').innerText = document.getElementById('issueDate').value;
    document.getElementById('pStatus').innerText = document.getElementById('status').value;
    document.getElementById('qrcode').innerHTML="";
    document.getElementById('printQR').innerHTML="";
    new QRCode(document.getElementById("qrcode"), { text: verifyLink, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.H });
    new QRCode(document.getElementById("printQR"), { text: verifyLink, width: 140, height: 140 });
    document.getElementById('qrLink').innerText = verifyLink;
    document.getElementById('viewLink').href = verifyLink;
    document.getElementById('printLink').innerText = verifyLink;
  }catch(e){ alert("Error: "+e.message); btn.innerText="💾 SAVE TO CLOUD & GENERATE QR"; btn.disabled=false; }
}
window.printCert = function(){ window.print(); }
</script>

.btn-gold{background:#facc15} .btn-dark{background:#0f172a;color:white} .btn-green{background:#0a4d2a;color:white}
label{font-size:11px;font-weight:800;color:#14532d;margin-top:10px;display:block}
#successBox,#formBox{display:none}
#pinBox{text-align:center}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;margin:0;padding:20px;box-sizing:border-box}
  .no-print{display:none}
}
</style>
