<!DOCTYPE html>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:Arial;background:#0a2a5e;padding:10px;margin:0}
.box{background:white;max-width:650px;margin:20px auto;padding:25px;border-radius:15px}
h2{text-align:center;color:#0a2a5e}
label{font-weight:bold;color:#0a2a5e;font-size:13px;display:block;margin-top:14px}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:8px;border:1.5px solid #ccc;box-sizing:border-box;font-size:14px}
.row{display:flex;gap:8px}
.row button{width:140px;background:#d35400;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.saveBtn{background:#0a2a5e;color:white;padding:16px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin-top:25px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#result{display:none;text-align:center;background:#f0fff4;border:2px solid green;padding:20px;border-radius:12px;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h2>ARNAUDAFROCHAINEVERIFICATION LTD</h2>
<p style="text-align:center;font-size:11px;color:red">TONIGHT ONLY - DELETE AFTER GENERATE</p>

<label>1. Certificate ID (12 Letters - AUTO)</label>
<div class="row">
<input id="certId" readonly style="font-weight:bold;color:#d35400;background:#fff3e0;letter-spacing:1.5px;font-size:16px">
<button onclick="gen12()">GEN 12</button>
</div>

<label>2. Full Name *</label><input id="fullName" placeholder="Full Name">
<label>3. Course *</label><input id="course" placeholder="Course / Program">
<label>4. Institution</label><input id="institution" value="ARNAUDAFROCHAINEVERIFICATION LTD">

<div class="grid">
<div><label>5. Certificate Type</label><select id="certType"><option>Certificate</option><option>Diploma</option><option>Attestation</option><option>Professional Certificate</option></select></div>
<div><label>6. Status</label><select id="status"><option>Completed</option><option>Original</option><option>Verified</option><option>Valid</option></select></div>
<div><label>7. Issue Date</label><input id="issueDate" type="date"></div>
<div><label>8. Expiry Date</label><input id="expiryDate" type="date" value="2030-09-19"></div>
<div><label>9. Grade / Score</label><input id="grade" placeholder="e.g. 85% - Excellent"></div>
<div><label>10. Duration</label><input id="duration" placeholder="e.g. 6 Months"></div>
</div>

<label>11. Issued By</label><input id="issuedBy" value="ARNAUDAFROCHAINEVERIFICATION LTD - arnaudafrochain@gmail.com">
<label>12. Note</label><textarea id="note" rows="2" placeholder="Description"></textarea>

<button class="saveBtn" onclick="save()">💾 GENERATE THIS NIGHT</button>

<div id="result">
<h3 id="rName"></h3>
<p id="rCert" style="color:#d35400;font-weight:bold;font-size:18px;letter-spacing:1px"></p>
<div id="qrcode" style="display:flex;justify-content:center;margin:15px 0"></div>
<p style="color:green;font-weight:bold">✅ SAVED + QR DONE</p>
</div>
</div>

<script>
// YOUR ORIGINAL FIREBASE KEY - 100% INSIDE - NO HIDING
const firebaseConfig={
apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
authDomain:"arnaudafrochaineverification.firebaseapp.com",
projectId:"arnaudafrochaineverification",
storageBucket:"arnaudafrochaineverification.firebasestorage.app",
messagingSenderId:"268502946630",
appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

document.getElementById('issueDate').valueAsDate=new Date();

function gen12(){
const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let code="AAC-";
for(let i=0;i<9;i++) code+=c[Math.floor(Math.random()*c.length)];
document.getElementById('certId').value=code;
}
gen12();

function save(){
const data={
certificateNumber:document.getElementById('certId').value.trim(),
studentName:document.getElementById('fullName').value.trim(),
course:document.getElementById('course').value.trim(),
institution:document.getElementById('institution').value.trim(),
certificateType:document.getElementById('certType').value,
status:document.getElementById('status').value,
issueDate:document.getElementById('issueDate').value,
expiryDate:document.getElementById('expiryDate').value,
grade:document.getElementById('grade').value.trim(),
duration:document.getElementById('duration').value.trim(),
issuedBy:document.getElementById('issuedBy').value.trim(),
note:document.getElementById('note').value.trim(),
contactEmail:"arnaudafrochain@gmail.com",
createdAt:new Date()
};
if(!data.studentName||!data.course){alert("Fill Name & Course Boss!");return;}
db.collection("certificates").doc(data.certificateNumber).set(data).then(()=>{
document.getElementById('rName').innerText=data.studentName+" - "+data.course;
document.getElementById('rCert').innerText=data.certificateNumber;
document.getElementById('result').style.display='block';
document.getElementById('qrcode').innerHTML="";
new QRCode(document.getElementById("qrcode"),{text:"https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify.html?cert="+data.certificateNumber,width:180,height:180});

}).catch(e=>{alert("Go Firebase > Firestore > Rules > change to allow read, write: if true; > Publish. Error: "+e.message)});
}
</script>
</body>
</html>
