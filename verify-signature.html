<!DOCTYPE html>
<html>
<head>
<title>VERIFY DOCUMENT - ARNAUD TRUST VERIFY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; padding:20px; background:#f5f5f5}
.box{background:white; padding:20px; border-radius:12px; max-width:650px; margin:auto; box-shadow:0 2px 15px #ccc}
.green{border:3px solid #0a5c36; background:#f0f9f0; padding:15px; border-radius:8px}
.red{border:3px solid #c00; background:#fff0f0; padding:15px; border-radius:8px}
input{width:100%; padding:14px; margin:10px 0; border-radius:8px; border:1px solid #aaa; font-size:16px}
button{width:100%; padding:14px; background:#0a5c36; color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px}
</style>
</head>
<body>
<div class="box">
<h2>🔍 VERIFY DOCUMENT</h2>
<p style="color:#555; font-size:13px;">ARNAUD AFROCHAINE VERIFICATION LTD</p>
<input id="hashInput" placeholder="Enter Hash or scan QR" />
<button onclick="verify()">✅ VERIFY NOW</button>
<div id="result" style="margin-top:20px;"></div>
<div id="qrBox" style="margin-top:20px; text-align:center; display:none; border-top:2px dashed #0a5c36; padding-top:20px;">
<h3 style="color:#0a5c36;">🔒 Official QR Seal</h3>
<img id="qrImg" style="width:300px; height:300px; border:8px solid #0a5c36; border-radius:12px;" />
<p id="qrLinkText" style="font-size:11px; word-break:break-all; color:#0a5c36; margin-top:10px;"></p>
<button onclick="window.print()" style="background:#222; margin-top:15px;">🖨️ PRINT CERTIFICATE</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function showQR(hash){
  const url = `https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/verify-signature.html?hash=${hash}`;
  const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(url)}`;
  document.getElementById('qrImg').src = qrApi;
  document.getElementById('qrLinkText').innerText = url;
  document.getElementById('qrBox').style.display='block';
}

window.verify = async function(){
  let hash = document.getElementById('hashInput').value.trim() || new URLSearchParams(location.search).get('hash');
  if(!hash){ alert('Enter hash'); return; }
  document.getElementById('result').innerHTML = 'Verifying...';
  try {
    let ref = doc(db, "sealedDocs", hash);
    let snap = await getDoc(ref);
    if(!snap.exists()){
      ref = doc(db, "sealed_documents", hash);
      snap = await getDoc(ref);
    }
    if(snap.exists()){
      const d = snap.data();
      document.getElementById('result').className='green';
      document.getElementById('result').innerHTML = `
        <h2 style="color:#0a5c36;">✅ VERIFIED - AUTHENTIC</h2>
        <p><b>Document:</b> ${d.docName || d.name || d.docType || 'Board Resolution'}</p>
        <p><b>Type:</b> ${d.docType || d.type || ''}</p>
        <p><b>Director:</b> ${d.director || d.directorName || ''}</p>
        <p><b>Sealed By:</b> ${d.sealedBy}</p>
        <p><b>Date:</b> ${d.timestamp ? new Date(d.timestamp.seconds*1000).toLocaleString() : (d.date || '')}</p>
        <p style="font-size:10px; background:white; padding:8px; word-break:break-all; border:1px dashed #0a5c36;">${hash}</p>
      `;
      showQR(hash);
    } else {
      document.getElementById('result').className='red';
      document.getElementById('result').innerHTML = `<h2 style="color:red;">❌ NOT FOUND - FAKE DOCUMENT</h2><p>Hash not found in ARNAUD TRUST VERIFY system.</p><p style="font-size:10px;">${hash}</p>`;
    }
  } catch(e){
    document.getElementById('result').innerHTML = 'Error: '+e.message;
  }
}

const urlHash = new URLSearchParams(location.search).get('hash');
if(urlHash){ document.getElementById('hashInput').value=urlHash; verify(); }
</script>
</body>
</html>
