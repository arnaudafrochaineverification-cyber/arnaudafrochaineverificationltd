<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify - ARNAUD TRUST SYSTEMS LTD RC 179223482696</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f0fdf4;margin:0;padding:14px}
.card{max-width:560px;margin:0 auto;background:white;border-radius:18px;padding:20px;box-shadow:0 15px 35px rgba(0,0,0,0.1);text-align:center}
.rc{font-size:9px;background:#0a1f0f;color:#4ade80;padding:5px 12px;border-radius:20px;font-weight:800;display:inline-block}
.badge{padding:10px 16px;border-radius:30px;font-weight:900;font-size:13px;margin:14px 0;display:inline-block}
.ok{background:#dcfce7;color:#166534;border:2px solid #22c55e}
.fail{background:#fee2e2;color:#991b1b;border:2px solid #ef4444}
.meta{text-align:left;background:#f8fafc;border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin:12px 0}
.hash{word-break:break-all;background:#052e16;color:#4ade80;padding:12px;border-radius:10px;font-size:10px;margin-top:12px;text-align:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box{border:2px solid #e2e8f0;border-radius:12px;padding:10px;background:#fafafa}
.box img{max-width:100%;border-radius:8px}
.box small{font-size:9px;font-weight:800;color:#64748b;display:block;margin-bottom:6px}
.btn{width:100%;margin-top:12px;padding:13px;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.btn-print{background:#0a1f0f;color:#4ade80}
.btn-home{background:white;color:#0a1f0f;border:2px solid #0a1f0f}
</style>
</head>
<body>
<div class="card">
<div class="rc">ARNAUD AFROCHAINE TRUST SYSTEMS LTD • RC 179223482696 • LTD</div>
<h2 style="margin:10px 0 4px">🔍 Document Verification</h2>
<small style="color:#64748b">Official Seal Verification Portal - Sango Ota</small>
<div id="content" style="margin-top:16px"><p>⏳ Fetching from ARNAUD Global Trust Network...</p><small id="hShow" style="word-break:break-all;color:#94a3b8;font-size:10px"></small></div>
</div>
<p style="text-align:center;font-size:9px;color:#94a3b8;margin-top:10px">Secured by 500B ARNAUD Blockchain Anchor • SHA-256 • Issuer Verified • Fingerprint & Signature Bound</p>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
  measurementId: "G-Y52LEBJM7Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const hash = params.get('hash');
document.getElementById('hShow').innerText = hash ? 'Checking hash: ' + hash : '';

async function run(){
 const box = document.getElementById('content');
 if(!hash){ box.innerHTML = '<div class="badge fail">❌ NO HASH</div><p>Scan valid QR</p>'; return; }
 try{
  const doc = await db.collection('documents').doc(hash).get();
  if(doc.exists){
   const d = doc.data();
   box.innerHTML = `
    <div class="badge ok">✅ VERIFIED AUTHENTIC • ISSUER CONFIRMED</div>
    <h3 style="margin:8px 0">${d.title || 'Document'}</h3>
    <small style="color:#166534;font-weight:700">${d.category || d.type || 'Board Resolution'} • ${d.dateLocal || d.date || ''}</small>
    <div class="meta">
      <b>📌 Title:</b> ${d.title}<br>
      <b>👤 Director:</b> ${d.director}<br>
      <b>🏢 Issuer:</b> ${d.issuer || 'ARNAUD AFROCHAINE TRUST'}<br>
      <b>🏛️ Company:</b> ${d.company || 'ARNAUD AFROCHAINE TRUST SYSTEMS LTD'} • RC ${d.rc || '179223482696'}<br>
      <b>📅 Date:</b> ${d.dateLocal || d.date || ''}<br>
      <b>⛓️ Blockchain:</b> ${d.blockchain || '500B ARNAUD'}
    </div>
    <div class="grid">
      <div class="box">
        <small>👆 FINGERPRINT (SPIKEY)</small>
        ${d.fpData ? `<img src="${d.fpData}" style="width:100px;height:100px;object-fit:cover;border:2px solid #22c55e">` : '<p style="font-size:11px;color:#999">No fingerprint on record<br><small>Seal again with fingerprint</small></p>'}
        <small style="margin-top:6px;color:#166534">Biometric bound</small>
      </div>
      <div class="box">
        <small>✍️ AUTHORIZED SIGNATURE</small>
        ${d.sigData ? `<img src="${d.sigData}" style="width:140px;height:70px;object-fit:contain;border:2px solid #22c55e;background:white">` : '<p style="font-size:11px;color:#999">No signature on record<br><small>Seal again with signature</small></p>'}
        <small style="margin-top:6px;color:#166534">Signature verified</small>
      </div>
    </div>
    <div class="hash">
      <b>SHA-256 Digital Fingerprint:</b><br>${d.hash}<br><br>
      <b>Integrity:</b> File matches original hash — No tampering<br>
      <b>Authenticity:</b> Issuer confirmed • Signature + Fingerprint present
    </div>
    <button class="btn btn-print" onclick="window.print()">🖨️ PRINT CERTIFICATE</button>
    <button class="btn btn-home" onclick="location.href='index.html'">← HOME</button>
   `;
   return;
  }
  const last = JSON.parse(localStorage.getItem('lastData')||'null');
  if(last && last.hash === hash){
   box.innerHTML = `<div class="badge ok">✅ VERIFIED LOCALLY</div><p><b>${last.title}</b><br>${last.director}</p><div class="hash">${hash}</div>`;
   return;
  }
  box.innerHTML = `<div class="badge fail">❌ HASH NOT FOUND</div><p>This hash no dey for Global Network.</p><div class="hash">Queried: ${hash}</div>`;
 }catch(e){ box.innerHTML = `<div class="badge fail">❌ ERROR</div><p>${e.message}</p><div class="hash">${hash}</div>`; }
}
run();
</script>
</body>
</html>
