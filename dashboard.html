<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - ARNAUD AFROCHAINE VERIFICATION LTD</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f6;
      color: #222;
    }

    header {
      background: #176b45;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    #logoutBtn {
      background: white;
      color: #176b45;
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome,
    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      color: #176b45;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    input[type="file"] {
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    .save-btn {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #176b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #0f5133;
    }

    .cancel-btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #777;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
    }

    .search {
      margin-bottom: 15px;
    }

    .certificate {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .certificate strong {
      color: #176b45;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 7px;
    }

    .verified {
      background: #d8f5df;
      color: #176b45;
    }

    .pending {
      background: #fff1c7;
      color: #765800;
    }

    .rejected {
      background: #ffdede;
      color: #a00000;
    }

    .link {
      display: inline-block;
      margin-top: 8px;
      color: #176b45;
      word-break: break-all;
    }

    .action-btn {
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin: 8px 5px 0 0;
    }

    .edit-btn {
      background: #e8f5e9;
      color: #176b45;
    }

    .delete-btn {
      background: #ffebee;
      color: #a00000;
    }

    .file-info {
      margin-top: 7px;
      font-size: 12px;
      color: #555;
    }

    .help {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ARNAUD AFROCHAINE VERIFICATION LTD</h1>
  <button id="logoutBtn">Logout</button>
</header>

<main>

  <div class="welcome">
    <h2>Admin Dashboard</h2>
    <p id="adminEmail">Checking administrator...</p>
  </div>

  <div class="card">

    <h2 id="formTitle">Add Certificate</h2>

    <form id="certificateForm">

      <div class="grid">

        <div>
          <label>Certificate Number</label>
          <input id="certificateNumber" required>
        </div>

        <div>
          <label>Reference</label>
          <input id="ref" required>
        </div>

        <div>
          <label>Full Name</label>
          <input id="fullName" required>
        </div>

        <div>
          <label>Certificate Type</label>
          <input
            id="certificateType"
            placeholder="University Degree / WAEC / NYSC..."
            required>
        </div>

        <div>
          <label>Course / Qualification</label>
          <input id="course">
        </div>

        <div>
          <label>School / Awarding Institution</label>
          <input id="school" required>
        </div>

        <div>
          <label>Issue Date</label>
          <input id="issueDate" type="date">
        </div>

        <div>
          <label>Status</label>
          <select id="status">
            <option value="Verified">Verified</option>
            <option value="Pending">Pending</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>

        <div class="full">
          <label>Certificate Image / PDF</label>
          <input
            id="certificateFile"
            type="file"
            accept="image/jpeg,image/png,image/webp,application/pdf">

          <div class="help">
            Allowed: JPG, PNG, WEBP or PDF. Maximum size: 10 MB.
          </div>

          <div
            id="currentFile"
            class="file-info">
          </div>
        </div>

        <div class="full">
          <label>Note</label>
          <textarea id="note"></textarea>
        </div>

      </div>

      <button
        id="saveBtn"
        class="save-btn"
        type="submit">
        Add Certificate
      </button>

      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button">
        Cancel Edit
      </button>

      <div id="message"></div>

    </form>

  </div>


  <div class="card">

    <h2>Certificate Records</h2>

    <input
      class="search"
      id="search"
      placeholder="Search by certificate number, name or reference...">

    <div id="certificateList">
      Loading certificates...
    </div>

  </div>

</main>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    doc,
    updateDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  import {
    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL,
    deleteObject
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-storage.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
    authDomain: "arnaudafrochaineverification.firebaseapp.com",
    projectId: "arnaudafrochaineverification",
    storageBucket: "arnaudafrochaineverification.firebasestorage.app",
    messagingSenderId: "268502946630",
    appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47",
    measurementId: "G-Y52LEBJM7Q"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);


  const PUBLIC_VERIFICATION_URL =
    "https://arnaudafrochaineverification-cyber.github.io/arnaudafrochaineverificationltd/?id=";


  let certificates = [];
  let editingId = null;
  let editingFilePath = null;


  /*
    LOGIN CHECK
  */

  onAuthStateChanged(auth, (user) => {

    if (!user) {
      window.location.href = "admin-login.html";
      return;
    }

    document.getElementById("adminEmail").textContent =
      "Logged in as: " + user.email;

    loadCertificates();

  });


  /*
    LOGOUT
  */

  document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

      await signOut(auth);

      window.location.href = "admin-login.html";

    });


  /*
    ADD / EDIT CERTIFICATE
  */

  document.getElementById("certificateForm")
    .addEventListener("submit", async (event) => {

      event.preventDefault();

      const message =
        document.getElementById("message");

      const saveBtn =
        document.getElementById("saveBtn");

      message.style.color = "#333";
      message.textContent = "Saving certificate...";
      saveBtn.disabled = true;


      try {

        const certificateNumber =
          document.getElementById("certificateNumber").value.trim();

        const ref =
          document.getElementById("ref").value.trim().toUpperCase();

        const fullName =
          document.getElementById("fullName").value.trim();

        const certificateType =
          document.getElementById("certificateType").value.trim();

        const course =
          document.getElementById("course").value.trim();

        const school =
          document.getElementById("school").value.trim();

        const issueDate =
          document.getElementById("issueDate").value;

        const status =
          document.getElementById("status").value;

        const note =
          document.getElementById("note").value.trim();

        const fileInput =
          document.getElementById("certificateFile");

        const file =
          fileInput.files[0];


        /*
          FILE VALIDATION
        */

        if (file) {

          const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "application/pdf"
          ];

          if (!allowedTypes.includes(file.type)) {
            throw new Error(
              "Only JPG, PNG, WEBP or PDF files are allowed."
            );
          }

          if (file.size > 10 * 1024 * 1024) {
            throw new Error(
              "File is too large. Maximum size is 10 MB."
            );
          }

        }


        const verifyLink =
          PUBLIC_VERIFICATION_URL +
          encodeURIComponent(ref);


        let certificateImageUrl =
          editingId ? getExistingImageUrl(editingId) : "";

        let certificateFilePath =
          editingId ? editingFilePath : "";


        /*
          UPLOAD FILE
        */

        if (file) {

          const safeFileName =
            file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

          const uniqueName =
            Date.now() + "_" + safeFileName;

          const filePath =
            "certificates/" +
            ref +
            "/" +
            uniqueName;

          const fileReference =
            storageRef(storage, filePath);

          await uploadBytes(fileReference, file);

          certificateImageUrl =
            await getDownloadURL(fileReference);

          certificateFilePath =
            filePath;


          /*
            Delete old file after successful replacement
          */

          if (editingId && editingFilePath) {

            try {

              await deleteObject(
                storageRef(storage, editingFilePath)
              );

            } catch (deleteError) {

              console.warn(
                "Old file could not be deleted:",
                deleteError
              );

            }

          }

        }


        const certificateData = {

          certificateNumber,
          certificateType,
          course,

          fullName,
          name: fullName,

          issueDate,
          status,
          note,

          ref,
          school,

          source: "Admin Portal",

          verifyLink,

          certificateImageUrl:
            certificateImageUrl || "",

          certificateFilePath:
            certificateFilePath || "",

          updatedAt:
            new Date().toISOString()

        };


        /*
          EDIT EXISTING
        */

        if (editingId) {

          await updateDoc(
            doc(db, "certificates", editingId),
            certificateData
          );

          message.style.color = "green";
          message.textContent =
            "Certificate updated successfully.";

        }


        /*
          ADD NEW
        */

        else {

          certificateData.createdAt =
            new Date().toISOString();

          await addDoc(
            collection(db, "certificates"),
            certificateData
          );

          message.style.color = "green";
          message.textContent =
            "Certificate added successfully.";

        }


        resetForm();
        await loadCertificates();


      } catch (error) {

        console.error(error);

        message.style.color = "red";
        message.textContent =
          "Could not save certificate: " +
          error.message;

      } finally {

        saveBtn.disabled = false;

      }

    });


  /*
    GET EXISTING IMAGE URL
  */

  function getExistingImageUrl(id) {

    const certificate =
      certificates.find(item => item.id === id);

    return certificate
      ? certificate.certificateImageUrl || ""
      : "";

  }


  /*
    LOAD CERTIFICATES
  */

  async function loadCertificates() {

    const list =
      document.getElementById("certificateList");

    list.textContent =
      "Loading certificates...";


    try {

      const certificateQuery =
        query(
          collection(db, "certificates"),
          orderBy("createdAt", "desc")
        );


      const snapshot =
        await getDocs(certificateQuery);


      certificates = [];


      snapshot.forEach((item) => {

        certificates.push({

          id: item.id,

          ...item.data()

        });

      });


      displayCertificates(certificates);


    } catch (error) {

      console.error(error);

      list.innerHTML =
        "<p>Could not load certificates.</p>";

    }

  }


  /*
    DISPLAY CERTIFICATES
  */

  function displayCertificates(data) {

    const list =
      document.getElementById("certificateList");


    if (data.length === 0) {

      list.innerHTML =
        "<p>No certificates found.</p>";

      return;
    }


    list.innerHTML = "";


    data.forEach((certificate) => {

      const item =
        document.createElement("div");

      item.className =
        "certificate";


      const statusClass =
        String(certificate.status || "")
          .toLowerCase();


      item.innerHTML = `

        <strong>Certificate Number:</strong>
        ${escapeHTML(certificate.certificateNumber || "")}

        <br>

        <strong>Name:</strong>
        ${escapeHTML(
          certificate.fullName ||
          certificate.name ||
          ""
        )}

        <br>

        <strong>Reference:</strong>
        ${escapeHTML(certificate.ref || "")}

        <br>

        <strong>School:</strong>
        ${escapeHTML(certificate.school || "")}

        <br>

        <span class="status ${statusClass}">
          ${escapeHTML(certificate.status || "Unknown")}
        </span>

        <br>

        ${
          certificate.verifyLink
          ?
          `<a class="link"
             href="${escapeAttribute(certificate.verifyLink)}"
             target="_blank">
             Open Verification
           </a>`
          :
          ""
        }

        ${
          certificate.certificateImageUrl
          ?
          `<br>
           <a class="link"
              href="${escapeAttribute(certificate.certificateImageUrl)}"
              target="_blank">
              📄 Open Certificate File
           </a>`
          :
          ""
        }

        <br>

        <button
          class="action-btn edit-btn"
          data-id="${escapeAttribute(certificate.id)}">
          ✏️ Edit
        </button>

        <button
          class="action-btn delete-btn"
          data-id="${escapeAttribute(certificate.id)}">
          🗑️ Delete
        </button>

      `;


      list.appendChild(item);

    });


    /*
      EDIT BUTTONS
    */

    list.querySelectorAll(".edit-btn")
      .forEach(button => {

        button.addEventListener("click", () => {

          editCertificate(button.dataset.id);

        });

      });


    /*
      DELETE BUTTONS
    */

    list.querySelectorAll(".delete-btn")
      .forEach(button => {

        button.addEventListener("click", () => {

          deleteCertificate(button.dataset.id);

        });

      });

  }


  /*
    EDIT CERTIFICATE
  */

  function editCertificate(id) {

    const certificate =
      certificates.find(item => item.id === id);

    if (!certificate) return;


    editingId = id;

    editingFilePath =
      certificate.certificateFilePath || null;


    document.getElementById("certificateNumber").value =
      certificate.certificateNumber || "";

    document.getElementById("ref").value =
      certificate.ref || "";

    document.getElementById("fullName").value =
      certificate.fullName ||
      certificate.name ||
      "";

    document.getElementById("certificateType").value =
      certificate.certificateType || "";

    document.getElementById("course").value =
      certificate.course || "";

    document.getElementById("school").value =
      certificate.school || "";

    document.getElementById("issueDate").value =
      certificate.issueDate || "";

    document.getElementById("status").value =
      certificate.status || "Verified";

    document.getElementById("note").value =
      certificate.note || "";


    document.getElementById("formTitle").textContent =
      "Edit Certificate";

    document.getElementById("saveBtn").textContent =
      "Update Certificate";

    document.getElementById("cancelBtn").style.display =
      "block";


    const currentFile =
      document.getElementById("currentFile");


    if (certificate.certificateImageUrl) {

      currentFile.innerHTML =
        `Current file:
         <a href="${escapeAttribute(
           certificate.certificateImageUrl
         )}" target="_blank">
           Open certificate file
         </a>`;

    } else {

      currentFile.textContent =
        "No certificate file uploaded.";

    }


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
    DELETE CERTIFICATE
  */

  async function deleteCertificate(id) {

    const certificate =
      certificates.find(item => item.id === id);

    if (!certificate) return;


    const confirmed =
      confirm(
        "Are you sure you want to delete this certificate?"
      );


    if (!confirmed) return;


    try {

      /*
        Delete Storage file first
      */

      if (certificate.certificateFilePath) {

        try {

          await deleteObject(
            storageRef(
              storage,
              certificate.certificateFilePath
            )
          );

        } catch (fileError) {

          console.warn(
            "Certificate file could not be deleted:",
            fileError
          );

        }

      }


      /*
        Delete Firestore record
      */

      await deleteDoc(
        doc(db, "certificates", id)
      );


      alert("Certificate deleted successfully.");

      await loadCertificates();


    } catch (error) {

      console.error(error);

      alert(
        "Could not delete certificate: " +
        error.message
      );

    }

  }


  /*
    CANCEL EDIT
  */

  document.getElementById("cancelBtn")
    .addEventListener("click", () => {

      resetForm();

    });


  /*
    RESET FORM
  */

  function resetForm() {

    document
      .getElementById("certificateForm")
      .reset();

    editingId = null;
    editingFilePath = null;

    document.getElementById("formTitle").textContent =
      "Add Certificate";

    document.getElementById("saveBtn").textContent =
      "Add Certificate";

    document.getElementById("cancelBtn").style.display =
      "none";

    document.getElementById("currentFile").textContent =
      "";

  }


  /*
    SEARCH
  */

  document.getElementById("search")
    .addEventListener("input", (event) => {

      const search =
        event.target.value
          .toLowerCase()
          .trim();


      const filtered =
        certificates.filter((certificate) => {

          const number =
            String(
              certificate.certificateNumber || ""
            ).toLowerCase();

          const name =
            String(
              certificate.fullName ||
              certificate.name ||
              ""
            ).toLowerCase();

          const ref =
            String(
              certificate.ref || ""
            ).toLowerCase();


          return (
            number.includes(search) ||
            name.includes(search) ||
            ref.includes(search)
          );

        });


      displayCertificates(filtered);

    });


  /*
    SECURITY HELPERS
  */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
  </html>
