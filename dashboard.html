<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - ARNAUD</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f4f7f6}
.top{background:#176b45;color:white;padding:15px;display:flex;justify-content:space-between}
.card{margin:15px;background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h2{color:#176b45}label{font-weight:bold;display:block;margin:12px 0 5px;font-size:13px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px}
button{background:#176b45;color:white;border:none;padding:14px;border-radius:7px;font-weight:bold;width:100%;margin-top:15px}
#msg{font-weight:bold;margin-top:10px;text-align:center}
</style></head><body>
<div class="top"><b>ARNAUD VERIFICATION</b><button onclick="logout()" style="width:auto;padding:8px 15px;background:white;color:#176b45;border-radius:6px">Logout</button></div>
<div class="card">
<div id="userInfo">Loading...</div>
<h2>Add Certificate</h2>
<form id="certForm">
<label>Certificate Number *</label><input id="certNum" required>
<label>Reference *</label><input id="ref" required>
<label>Full Name *</label><input id="fullName" required>
<label>Certificate Type</label><input id="certType" placeholder="Degree">
<label>Course</label><input id="course">
<label>School</label><input id="school">
<label>Issue Date</label><input type="date" id="issueDate">
<label>Status</label><select id="status"><option>Verified</option><option>Pending</option><option>Invalid</option></select>
<label>Certificate Image *</label><input type="file" id="certImg" accept="image/*" required>
<div style="font-size:12px;color:#666">Image will be compressed automatically (no Storage needed)</div>
<label>Note</label><textarea id="note" rows="3"></textarea>
<button type="submit" id="addBtn">Add Certificate</button>
<div id="msg"></div>
</form>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (u)=>{ if(!u) location.href="admin-login.html"; else document.getElementById('userInfo').innerHTML=`Logged in as: <b>${u.email}</b>`; });
window.logout=async()=>{await signOut(auth); location.href="admin-login.html";}

// Compress image to base64
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas=document.createElement('canvas');
        let w=img.width, h=img.height;
        const max=800; // max width/height
        if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.7)); // compressed jpeg 70%
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('certForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('addBtn'); const msg=document.getElementById('msg');
  btn.disabled=true; msg.style.color="#333"; msg.textContent="Compressing image...";
  try{
    const certNum=document.getElementById('certNum').value.trim();
    const file=document.getElementById('certImg').files[0];
    if(!file) throw new Error("Add image");
    const base64 = await compressImage(file);
    
    msg.textContent="Saving...";
    await setDoc(doc(db, "certificates", certNum), {
      certNumber: certNum,
      reference: document.getElementById('ref').value.trim(),
      fullName: document.getElementById('fullName').value.trim(),
      certificateType: document.getElementById('certType').value.trim(),
      course: document.getElementById('course').value.trim(),
      school: document.getElementById('school').value.trim(),
      issueDate: document.getElementById('issueDate').value,
      status: document.getElementById('status').value,
      note: document.getElementById('note').value.trim(),
      imageBase64: base64,
      imageUrl: base64,
      createdAt: serverTimestamp(),
      verifiedBy: auth.currentUser.email
    });
    msg.style.color="green";
    msg.textContent=`✅ Saved! Link: verify.html?id=${certNum}`;
    e.target.reset();
  }catch(err){ msg.style.color="red"; msg.textContent="❌ "+err.message; console.error(err); }
  btn.disabled=false;
});
</script></body></html>
