<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - ARNAUD AFROCHAINE VERIFICATION LTD</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f4f7f6}
.top{background:#0a1931;color:white;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
.top .brand{display:flex;align-items:center;gap:10px}
.top img{width:42px;height:42px;border-radius:50%;border:2px solid #C9A227;background:white;object-fit:contain}
.top b{color:#C9A227; font-size:13px; line-height:1.2}
.card{margin:15px;background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h2{color:#0a4d2a}label{font-weight:bold;display:block;margin:12px 0 5px;font-size:12px;color:#14532d}
label span{font-weight:400; color:#64748b; font-size:10px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px}
button{background:#0a4d2a;color:white;border:none;padding:14px;border-radius:7px;font-weight:bold;width:100%;margin-top:15px;cursor:pointer}
#msg{font-weight:bold;margin-top:10px;text-align:center;white-space:pre-wrap}
.linkBox{background:#ecfdf5;border:1px dashed #0a4d2a;padding:12px;border-radius:10px;margin-top:12px;font-size:12px;word-break:break-all;text-align:center}
#qrcode{display:flex;justify-content:center;margin:12px 0}
#qrcode img{border:6px solid white;box-shadow:0 2px 10px rgba(0,0,0,.2);border-radius:8px}
.btnRow{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:12px}
.btnRow button{width:auto; padding:10px 16px; font-size:12px; margin-top:0}
.auto{background:#fff8d6; border:2px solid #C9A227}
.manual{background:#f0f9ff; border:2px solid #0a4d2a}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head><body>

<div class="top">
<div class="brand">
<img src="logo.jpg" alt="LOGO" onerror="this.style.display='none'">
<div><b>ARNAUD AFROCHAINE<br>VERIFICATION LTD</b><div style="font-size:9px;color:#fff;font-weight:400">African Roots, Global Vision • 500B ARNAUD</div></div>
</div>
<button onclick="logout()" style="width:auto;padding:8px 15px;background:white;color:#0a1931;border-radius:6px;border:none;font-weight:bold">Logout</button>
</div>

<div class="card">
<div id="userInfo" style="font-size:12px;color:#64748b">Loading...</div>
<h2>Add New Certificate - CORRECTED</h2>
<p style="font-size:10px;color:#176b45;background:#ecfdf5;padding:8px;border-radius:6px">✅ VR-AAV = Our auto ref (ARNAUD) • School Cert No = YOU type student own number</p>
<form id="certForm">
<label>Our Verification Reference (ARNAUD Auto) * <span>- Auto generates VR-AAV-YYYY-XXXX</span></label>
<input id="ref" required class="auto" placeholder="VR-AAV-2026-XXXX">

<label>School Certificate Number (Student Own) * <span>- YOU MUST TYPE as school give am</span></label>
<input id="certNum" required class="manual" placeholder="e.g GFA/CAT/2024/1127 or CERT-2026-001">

<label>Full Name *</label><input id="fullName" required placeholder="ALEXANDRE or GBADAMASI SANUSI">
<label>Certificate Type</label><input id="certType" placeholder="Business / Diploma" value="Verification">
<label>Course / Category</label><input id="course" placeholder="Catering & Hospitality">
<label>School / Entity *</label><input id="school" required placeholder="Goldfields Academy or Government School">
<label>Issue Date *</label><input type="date" id="issueDate" required>
<label>Wallet Address *</label><input id="wallet" required value="0x6447...fAE2" style="font-family:monospace">
<label>Status</label><select id="status"><option>Verified</option><option>Pending</option><option>Invalid</option></select>
<label>Note</label><textarea id="note" rows="2">ARNAUD AFROCHAINE VERIFICATION LTD - Blockchain Secured - NDPA 2023 Compliant</textarea>
<button type="submit" id="addBtn">Save Certificate & Generate Luxury QR</button>
<div id="msg"></div>
<div id="linkResult"></div>
</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",
  authDomain: "arnaudafrochaineverification.firebaseapp.com",
  projectId: "arnaudafrochaineverification",
  storageBucket: "arnaudafrochaineverification.firebasestorage.app",
  messagingSenderId: "268502946630",
  appId: "1:268502946630:web:c7abe320c83a1d9c3b4b47"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function generateHash(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = ((hash<<5)-hash)+str.charCodeAt(i); hash = hash & hash; }
  const hex = Math.abs(hash).toString(16) + Date.now().toString(16) + Math.random().toString(16).substring(2,10);
  return hex.substring(0,32) + "a7f3e9c" + hex.substring(0,12);
}
function generateVR(){
  const year = new Date().getFullYear();
  const num = Math.floor(1000 + Math.random()*9000);
  return `VR-AAV-${year}-${num}`;
}

onAuthStateChanged(auth, (u)=>{ 
  if(!u) location.href="admin.html"; 
  else {
    document.getElementById('userInfo').innerHTML=`Logged in: <b>${u.email}</b> | Wallet: 0x6447...fAE2 | 500B ARNAUD`;
    // ONLY auto VR reference
    if(!document.getElementById('ref').value) document.getElementById('ref').value = generateVR();
    // LEAVE school cert number EMPTY for manual entry
    document.getElementById('certNum').value = "";
    if(!document.getElementById('issueDate').value) document.getElementById('issueDate').valueAsDate = new Date();
  }
});
window.logout=async()=>{await signOut(auth); location.href="admin.html";}

document.getElementById('certForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('addBtn'); const msg=document.getElementById('msg'); const linkResult=document.getElementById('linkResult');
  btn.disabled=true; msg.style.color="#333"; msg.textContent="⏳ Saving with both numbers...";
  try{
    const refRaw = document.getElementById('ref').value.trim() || generateVR();
    const certNumRaw = document.getElementById('certNum').value.trim();
    if(!certNumRaw){ alert("Oga, you must type School Certificate Number - student own!"); btn.disabled=false; return; }
    const fullNameRaw = document.getElementById('fullName').value.trim();
    const schoolRaw = document.getElementById('school').value.trim() || "ARNAUD AFROCHAINE VERIFICATION LTD";
    const courseRaw = document.getElementById('course').value.trim();
    const issueDateRaw = document.getElementById('issueDate').value.trim();
    const walletRaw = document.getElementById('wallet').value.trim() || "0x6447...fAE2";
    
    const safeDocId = refRaw.replace(/\//g, "-").replace(/[^a-zA-Z0-9-_]/g, "_");
    const blockchainHash = generateHash(refRaw + fullNameRaw + certNumRaw + Date.now());

    const data = {
      ref: refRaw, reference: refRaw, refNumber: refRaw,
      certNumber: certNumRaw, certificateNumber: certNumRaw, schoolCertNumber: certNumRaw,
      fullName: fullNameRaw, name: fullNameRaw,
      certificateType: document.getElementById('certType').value.trim(),
      course: courseRaw, school: schoolRaw, institution: schoolRaw,
      issueDate: issueDateRaw, year: (issueDateRaw || '').substring(0,4),
      wallet: walletRaw, walletAddress: walletRaw,
      status: document.getElementById('status').value,
      note: document.getElementById('note').value.trim(),
      hash: blockchainHash, blockchainHash: blockchainHash,
      ndpaCompliant: true,
      blockchainWallet: "0x64478336d9018927C8E45AcC35e9e24c969EfAE2",
      createdAt: serverTimestamp(), verifiedBy: auth.currentUser.email
    };

    await setDoc(doc(db, "certificates", safeDocId), data);
    msg.style.color="green";
    msg.textContent=`✅ SAVED! Our Ref: ${refRaw} | School No: ${certNumRaw}`;

    const verifyLink = `https://n-cyber.github.io/ArnaudAfrochaineVerification/verify.html?ref=${encodeURIComponent(refRaw)}`;
    const printLink = `certificate-template.html?ref=${encodeURIComponent(refRaw)}&cert=${encodeURIComponent(certNumRaw)}&name=${encodeURIComponent(fullNameRaw)}&date=${encodeURIComponent(issueDateRaw)}&wallet=${encodeURIComponent(walletRaw)}&school=${encodeURIComponent(schoolRaw)}&course=${encodeURIComponent(courseRaw)}&hash=${encodeURIComponent(blockchainHash)}`;

    linkResult.innerHTML = `
      <div class="linkBox">
        <b>✅ Both Numbers Saved!</b><br>
        Our VR: <b>${refRaw}</b><br>School Cert: <b>${certNumRaw}</b><br>
        <small>Wallet: ${walletRaw}</small>
        <div id="qrcode"></div>
        <div class="btnRow">
          <button type="button" onclick="window.open('${verifyLink}')" style="background:#C9A227;color:#0a1931">🔍 Verify</button>
          <button type="button" onclick="window.open('${printLink}','_blank')" style="background:#0a4d2a; border:2px solid #C9A227">🖨️ Print Luxury</button>
        </div>
      </div>
    `;

    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: verifyLink, width: 180, height: 180,
      colorDark : "#0a1931", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
    });
    // Generate new VR for next entry, but leave school cert empty
    document.getElementById('ref').value = generateVR();
    document.getElementById('certNum').value = "";
    document.getElementById('fullName').value = "";

  }catch(err){ msg.style.color="red"; msg.textContent="❌ "+err.message; console.error(err); }
  btn.disabled=false;
});
</script></body></html>
