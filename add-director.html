<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Director - Secured</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial;background:#f5f5f5;padding:15px} .card{max-width:500px;margin:20px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.green{background:#0d4a2e;color:white} .red{background:#c62828;color:white} .blue{background:#1565c0;color:white}
.msg{margin-top:10px;padding:12px;border-radius:8px;display:none}
.ok{background:#e8f5e9;color:#2e7d32} .err{background:#ffebee;color:#c62828}
.logged{background:#e8f5e9;padding:10px;border-radius:8px;margin-bottom:10px;font-size:14px}
</style></head><body><div class="card">
<h2 style="color:#0d4a2e">➕ ADD DIRECTOR - SECURED</h2>
<div id="loginBox"><p>Click login, e go carry you go Google, then bring you back!</p><button class="blue" onclick="login()">🔐 LOGIN WITH GOOGLE</button></div>
<div id="userBox" style="display:none"><div id="loggedInfo" class="logged"></div>
<button class="red" onclick="logout()">🚪 LOGOUT</button>
<input id="dName" placeholder="Director Full Name">
<input id="dTitle" placeholder="Title e.g. Managing Director">
<input id="dID" placeholder="Director ID e.g. DIR001">
<button class="green" onclick="saveDirector()">💾 SAVE DIRECTOR</button>
<div id="msg" class="msg"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBef7ts19mynG9Er4U8qaUYcS7Ye3SYpbs",authDomain:"arnaudafrochaineverification.firebaseapp.com",projectId:"arnaudafrochaineverification",storageBucket:"arnaudafrochaineverification.firebasestorage.app",messagingSenderId:"268502946630",appId:"1:268502946630:web:c7abe320c83a1d9c3b4b47",measurementId:"G-Y52LEBJM7Q"};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore();
function login(){ const provider = new firebase.auth.GoogleAuthProvider(); auth.signInWithRedirect(provider); }
function logout(){auth.signOut().then(()=>location.reload());}
auth.onAuthStateChanged(user=>{if(user){document.getElementById('loginBox').style.display='none';document.getElementById('userBox').style.display='block';document.getElementById('loggedInfo').innerHTML='✅ Logged as:<br><b>'+user.email+'</b>';}else{document.getElementById('loginBox').style.display='block';document.getElementById('userBox').style.display='none';}});
auth.getRedirectResult().then(()=>{}).catch(e=>{alert(e.message)});
function showMsg(t,ok){const m=document.getElementById('msg');m.style.display='block';m.className='msg '+(ok?'ok':'err');m.innerHTML=t;}
function saveDirector(){const n=document.getElementById('dName').value.trim(),ti=document.getElementById('dTitle').value.trim(),id=document.getElementById('dID').value.trim();if(!n||!ti||!id){showMsg('Fill all fields Oga!',false);return;}
db.collection('directors').doc(id).set({name:n,title:ti,id:id,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:auth.currentUser.email}).then(()=>{showMsg('✅ Director '+n+' SAVED! Go check seal-document',true);}).catch(e=>showMsg('❌ '+e.message,false));}
</script></body></html>
